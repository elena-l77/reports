  :root{
    --paper:#faf6ef;
    --paper-line:#e7ddc9;
    --ink:#332b22;
    --ink-soft:#6b6153;
    --card:#ffffff;
    --card-border:#eae1cf;
    --accent-neutral:#8a7f6b;

    --c-speech:#d1577a;      /* Развитие речи */
    --c-speech-bg:#fbe9ee;
    --c-reading:#6a4fa0;     /* Чтение */
    --c-reading-bg:#efe8f7;
    --c-math:#3f6fa8;        /* Математика */
    --c-math-bg:#e8eff8;
    --c-writing:#f49f28;     /* Письмо */
    --c-writing-bg:#fdf0dc;
    --c-world:#3f8f4f;       /* Окружающий мир */
    --c-world-bg:#e6f4e7;
    --c-art:#c1548c;         /* Творчество */
    --c-art-bg:#faeaf3;
    --c-world24:#2f7a6e;     /* Окружающий мир (2024-2025) */
    --c-world24-bg:#e3f1ee;
    --c-art24:#7a3357;       /* Творчество (2024/2025) */
    --c-art24-bg:#f4e2ec;
    --c-other:#7a7264;       /* Другое */
    --c-other-bg:#efeae0;

    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 33px,
        var(--paper-line) 34px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'Literata', Georgia, serif;
    min-height:100vh;
    padding:28px 18px 80px;
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
  }

  header.top{
    margin-bottom:28px;
  }
  header.top h1{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-weight:400;
    font-size:clamp(26px,4.2vw,34px);
    margin:0;
    letter-spacing:-0.01em;
  }

  .subjects{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .chip{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-weight:400;
    font-size:14.5px;
    border-radius:999px;
    border:1.5px solid var(--card-border);
    background:var(--card);
    color:var(--ink);
    padding:9px 16px 9px 13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow:0 1px 2px rgba(51,43,34,.04);
    transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease, color .12s ease;
  }
  .chip:hover{
    transform:translateY(-1px);
    border-color:var(--dot,#999);
    box-shadow:0 3px 8px rgba(51,43,34,.08);
  }
  .chip .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--dot,#999);
    flex:none;
    transition:background .12s ease;
  }
  .chip .count{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-weight:400;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper);
    border-radius:999px;
    padding:1px 8px;
    transition:background .12s ease, color .12s ease;
  }
  .chip.active{
    background:var(--dot,#999);
    border-color:var(--dot,#999);
    color:#fff;
    box-shadow:0 3px 10px rgba(51,43,34,.14);
  }
  .chip.active .dot{ background:#fff; }
  .chip.active .count{ background:rgba(255,255,255,.28); color:#fff; }

  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .panel-head h2{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-size:21px;
    font-weight:400;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel-head h2 .sw{
    width:13px;height:13px;border-radius:4px;background:var(--dot,#999);
    display:inline-block;
  }
  .panel-head .n{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .report{
    background:var(--card);
    border:1px solid var(--card-border);
    border-left:5px solid var(--dot,#999);
    border-radius:var(--radius);
    padding:14px 16px 14px 14px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .report .badge{
    font-family:'Fredoka One Cyrillic',sans-serif;
    font-weight:400;
    font-size:13px;
    color:#fff;
    background:var(--dot,#999);
    width:26px;height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    margin-top:2px;
  }
  .report .body{ flex:1; min-width:0; }
  .report .text{
    font-family:'Andika', Arial, sans-serif;
    font-weight:700;
    font-size:15.5px;

ая на вопросы педагога.", "id": "speech-2025-12-02-0"}, {"date": "5 декабря 2025", "iso": "2025-12-05", "text": "Зима:\n🔹 продолжили пополнять словарный запас прилагательными и глаголами по теме, учились подбирать антонимы;\n🔹 учились согласовывать прилагательные и существительные в роде и числе (зима холодная, снег холодный, снежинки холодные).", "id": "speech-2025-12-05-0"}, {"date": "9 декабря 2025", "iso": "2025-12-09", "text": "Заучивание наизусть новогодних стихотворений:\n🔹 познакомились со стихотворением Е. Тараховской \"Дед Мороз\";\n🔹 выучили стихотворение с опорой на мнемотаблицу;\n🔹 тренировались в подборе рифм к словам по теме занятия.", "id": "speech-2025-12-09-0"}, {"date": "12 декабря 2025", "iso": "2025-12-12", "text": "Заучивание наизусть новогодних стихотворений:\n🔹 повторили стихотворение Е. Тараховской \"Дед Мороз\";\n🔹 познакомились со стихотворением Т. Мельниковой \"Дед Мороз проспал в постели\";\n🔹 учили стихотворение с опорой на мнемотаблицу.", "id": "speech-2025-12-12-0"}, {"date": "16 декабря 2025", "iso": "2025-12-16", "text": "Подготовка к Новогоднему празднику:\n🔹 познакомились с новыми стихотворениями, работали над пониманием содержания.", "id": "speech-2025-12-16-0"}, {"date": "18 декабря 2025", "iso": "2025-12-18", "text": "Повторение новогодних стихотворений, учимся читать с выражением.", "id": "speech-2025-12-18-0", "edited": true}, {"date": "26 декабря 2025", "iso": "2025-12-26", "text": "Чтение рассказа Сергея Георгиева \"Я спас Деда Мороза\":\n🔹 познакомились с новым художественным произведением, обсудили, почему это рассказ, а не сказка;\n🔹 учились формулировать главную мысль рассказа.", "id": "reading-2025-12-26-0", "edited": true}, {"date": "13 января 2026", "iso": "2026-01-13", "text": "Составление рассказа \"Мои новогодние каникулы\":\n🔹 формировали умение составлять рассказ, опираясь на личный опыт по плану;\n🔹 учились составлять план, пользоваться мнемоническими сигналами.", "id": "speech-2026-01-13-0"}, {"date": "14 января 2026", "iso": "2026-01-14", "text": "В. Бианки \"Купание медвежат\":\n🔹 познакомились с произведением В. Бианки «Купание медвежат», рассмотрели портрет автора;\n🔹 передали основную идею произведения, отвечали на вопросы по содержанию, развивали диалогическую речь.", "id": "speech-2025-12-20-0", "edited": true}, {"date": "16 января 2026", "iso": "2026-01-16", "text": "Пересказ рассказа В. Бианки \"Купание медвежат\":\n🔹 обучались связному последовательному пересказу текста с наглядной опорой на мнемотаблицу.", "id": "speech-2026-01-23-0", "edited": true}, {"date": "23 января 2026", "iso": "2026-01-23", "text": "Звуковая культура речи. Дифференциация звуков [ж], [ш]:\n🔹 развивали фонематический слух, упражнялись в различении звуков в изоляции и словах в разных позициях;\n🔹 читали слова со звуками, упражнялись в отчётливом произнесении слов.", "id": "speech-2026-01-16-0", "edited": true}, {"date": "27 января 2026", "iso": "2026-01-27", "text": "Формирование лексико-грамматических представлений. Составление трёхсловных предложений:\n🔹 учились составлять предложения из 3-х слов по образцу (Игра \"Добавляй словечко\");\n🔹 исправляли ошибки в предложениях (Игра \"Незнайка\").", "id": "speech-2026-01-27-0"}, {"date": "30 января 2026", "iso": "2026-01-30", "text": "Заучивание наизусть стихотворения И. Сурикова \"Детство\" (отрывок):\n🔹 познакомились с новым поэтическим произведением;\n🔹 учились выразительно читать наизусть стихотворение с опорой на мнемотаблицу.", "id": "speech-2026-01-30-0"}, {"date": "3 февраля 2026", "iso": "2026-02-03", "text": "Заучивание наизусть стихотворения Сурикова \"Детство\" (отрывок):\n🔹 познакомились с биографией автора, прослушали отрывки некоторых стихотворных произведений;\n🔹 продолжили учить наизусть стихотворение с опорой на мнемотаблицу.", "id": "speech-2026-02-03-0"}, {"date": "6 февраля 2026", "iso": "2026-02-06", "text": "Согласование числительных \"один\", \"одна\" с существительными:\n🔹 учились соотносить на слух и правильно согласовывать существительные мужского и женского рода с числительными \"один\", \"одна\" (Игра \"Найди место\").", "id": "speech-2026-02-06-0"}, {"date": "10 февраля 2026", "iso": "2026-02-10", "text": "Эскимосская сказка \"Как лисичка бычка обидела\":\n🔹 познакомились с новым произведением народного творчества;\n🔹 формировали умение понимать главную идею произведения, правильно оценивать поступки героев.", "id": "speech-2026-02-10-0"}, {"date": "13 февраля 2026", "iso": "2026-02-13", "text": "Пересказ эскимосской сказки \"Как лисичка бычка обидела\":\n🔹 формировали умение связно и последовательно пересказывать небольшие сказки с опорой на мнемотаблицу;\n🔹 развивали диалогическую и монологическую речь.", "id": "speech-2026-02-13-0"}, {"date": "24 февраля 2026", "iso": "2026-02-24", "text": "Заучивание наизусть стихотворения Р. Сефа \"Совет\":\n🔹 беседовали о дружбе и ссорах, осознали, что ссориться нельзя;\n🔹 учились образовывать уменьшительно-ласкательные формы от имён собственных;\n🔹 учились выразительно читать наизусть стихотворение с опорой на мнемотаблицу.", "id": "speech-2026-02-24-0"}, {"date": "27 февраля 2026", "iso": "2026-02-27", "text": "Заучивание наизусть стихотворения Р. Сефа \"Совет\":\n🔹 продолжили беседу об опасности ссор, вспомнили способы, с помощью которых можно помириться, инсценировали один из них (\"Мирись, мирись\");\n🔹 выразительно читали наизусть стихотворение с опорой на мнемотаблицу.", "id": "speech-2026-02-27-0"}, {"date": "3 марта 2026", "iso": "2026-03-03", "text": "Звуковая культура речи. Дифференциация звуков [с], [ш]:\n🔹 совершенствовали слуховое восприятие с помощью упражнений на различение звуков;\n🔹 учились соотносить звук и букву (Игра \"Что я слышу, что я вижу).", "id": "speech-2026-03-03-0"}, {"date": "6 марта 2026", "iso": "2026-03-06", "text": "Формирование лексико-грамматических представлений. Родительный падеж существительных:\n🔹 учились изменять начальную форму существительных, образовывать форму родительного падежа;\n🔹 учились дифференцировать вопросы кого? чего?", "id": "speech-2026-03-06-0"}, {"date": "10 марта 2026", "iso": "2026-03-10", "text": "Образование форм родительного падежа существительных:\n🔹 продолжили учиться выделять голосом окончания форм родительного падежа;\n🔹 учились отвечать на вопросы кого? чего?", "id": "speech-2026-03-10-0"}, {"date": "13 марта 2026", "iso": "2026-03-13", "text": "Чтение стихотворения Ф.И. Тютчева \"Зима недаром злится\":\n🔹 познакомились со стихотворением, учились понимать содержание, отвечали на вопросы педагога;\n🔹 обратили внимание на образные слова, выражения, устаревшие слова.", "id": "reading-2026-03-13-0", "edited": true}, {"date": "17 марта 2026", "iso": "2026-03-17", "text": "Нанайская сказка \"Айога\":\n🔹 познакомились с новым произведением народного творчества;\n🔹 учились отвечать на вопросы по содержанию сказки, характеризовать героев, высказывать своё отношение к ним, сочинили счастливый финал.", "id": "speech-2026-03-17-0"}, {"date": "20 марта 2026", "iso": "2026-03-20", "text": "Формирование лексико-грамматических представлений. Винительный падеж существительных:\n🔹 учились дифференцировать вопросы кто? кого? что?\n🔹 учились изменять начальную форму существительных, образовывать форму винительного падежа.", "id": "speech-2026-03-20-0"}, {"date": "24 марта 2026", "iso": "2026-03-24", "text": "Сказка Б. Шергина \"Рифмы\":\n🔹 познакомились с необычной сказкой Б. Шергина \"Рифмы\";\n🔹 учились вести беседу, отвечать на вопросы и задавать их (Игра \"Колечко-колечко\").", "id": "speech-2026-03-24-0"}, {"date": "27 марта 2026", "iso": "2026-03-27", "text": "Звуковая культура речи. Дифференциация звуков [з], [ж]:\n🔹 совершенствовали слуховое восприятие с помощью упражнений на различение звуков;\n🔹 учились соотносить звук и букву (Игра \"Что я слышу, что я вижу\").", "id": "speech-2026-03-27-0"}, {"date": "7 апреля 2026", "iso": "2026-04-07", "text": "Приход весны:\n🔹 обогащали и расширяли словарный запас по теме;\n🔹 систематизировали знания о весенних явлениях природы;\n🔹 совершенствовали умение образовывать существительные во множественном числе и с помощью уменьшительно-ласкательных суффиксов.", "id": "speech-2026-04-07-0"}, {"date": "9 апреля 2026", "iso": "2026-04-09", "text": "Весна:\n🔹 прослушали стихи о весне, учились описывать красоту природы;\n🔹 закрепляли образование форм множественного числа;\n🔹 развивали умение отвечать на вопросы полным предложением.", "id": "speech-2026-04-09-0"}, {"date": "14 апреля 2026", "iso": "2026-04-14", "text": "Пересказ сказки Э. Шима «Соловей и воронёнок»:\n🔹 прочитали сказку, учились пересказывать текст по ролям, произносить предложения с нужной интонацией;\n🔹 послушали голоса птиц, отгадывли загадки, обогащали словарный запас словами с уменьшительно-ласкательными суффиксами.", "id": "speech-2026-04-14-0"}, {"date": "17 апреля 2026", "iso": "2026-04-17", "text": "Беседа на тему \"О друзьях и дружбе\":\n🔹 продолжили осваивать нормы поведения, учились доброжелательности;\n🔹 обогащали лекску синонимами и эпитетами.", "id": "speech-2026-04-17-0"}, {"date": "21 апреля 2026", "iso": "2026-04-21", "text": "Звуковая культура речи. Дифференциация звуков [ч'], [щ']:\n🔹 совершенствовали слуховое восприятие с помощью упражнений на различение звуков;\n🔹 учились соотносить звук и букву (Игра \"Что я слышу, что я вижу\").", "id": "speech-2026-04-21-0"}, {"date": "24 апреля 2026", "iso": "2026-04-24", "text": "Сказка А.Н. Толстого \"Ёж\":\n🔹 познакомились со сказкой, учились пересказывать её с опорой на мнемотаблицу, сохраняя некоторые авторские обороты;\n🔹 продолжили учиться различать произведения различных жанров.", "id": "speech-2026-04-24-0"}, {"date": "28 апреля 2026", "iso": "2026-04-28", "text": "Предлог \"на\":\n🔹 учились выделять предлог \"на\" в предложениях и словосочетаниях;\n🔹 составляли предложения с предлогом \"на\" по двум опорным словам.", "id": "speech-2026-04-28-0"}, {"id": "speech-2026-04-29-0", "iso": "2026-04-29", "date": "29 апреля 2026", "text": "Стихотворение Ю. Владимирова \"Чудаки\":\n🔹 познакомились с новым стихотворным произведением, учились внимательно слушать, понимать юмор, отвечать на вопросы;\n🔹 активизировали в речи слова \"кушак\", \"колпак\", \"пятак\", \"чудак\".", "isNew": true}, {"date": "5 мая 2026", "iso": "2026-05-05", "text": "Падежные конструкции. Дательный падеж существительных в единственном числе:\n🔹 учились правильно употреблять форму дательного падежа без предлога;\n🔹 учились образовывать существительные в дательном падеже от существительных в именительном падеже.", "id": "speech-2026-05-05-0"}, {"date": "8 мая 2026", "iso": "2026-05-08", "text": "Чтение рассказов из книги Г. Снегирёва «Про пингвинов»:\n🔹 познакомились с маленькими рассказами из жизни пингвинов;\n🔹 учились строить сложноподчиненные предложения;\n🔹 активизировали и расширяли словарный запас новыми словами (фанера, примус).", "id": "reading-2026-05-08-1", "edited": true}, {"date": "26 мая 2026", "iso": "2026-05-26", "text": "Согласование местоимений «мой», «моя» с существительными:\n🔹 учились согласовывать местоимения с существительными в роде;\n🔹 учились подбирать к местоимению существительные соответствующего рода, учились исправлять ошибки в согласовании.", "id": "speech-2026-05-26-0"}, {"date": "28 мая 2026", "iso": "2026-05-28", "text": "Дифференциация звуков [л], [р]:\n🔹 упражнялись в различении звуков [л], [р] в словах, фразовой речи;\n🔹 учились определять позицию звука в слове.", "id": "speech-2026-05-28-0"}], "Чтение": [{"date": "3 сентября 2025", "iso": "2025-09-03", "text": "Диагностика уровня развития навыков чтения:\n🔹 выявляли сформированность навыков чтения (знание букв, умение читать по слогам, выделять звуки);\n🔹 работали со складовыми карточками Зайцева, использовали приёмы фоноритмики.", "id": "reading-2025-09-03-0"}, {"date": "4 сентября 2025", "iso": "2025-09-04", "text": "Диагностика уровня развития навыков чтения:\n🔹 продолжили работать со складовыми карточками Зайцева, использовали приёмы фоноритмики.", "id": "reading-2025-09-04-0"}, {"date": "4 сентября 2025", "iso": "2025-09-04", "text": "Диагностика уровня развития навыков чтения:\n🔹 продолжили работать со складовыми карточками Зайцева, использовали приёмы фоноритмики.", "id": "reading-2025-09-04-1"}, {"date": "5 сентября 2025", "iso": "2025-09-05", "text": "Диагностика уровня развития навыков чтения:\n🔹 продолжили работать со складовыми карточками Зайцева, использовали приёмы фоноритмики;\n🔹 работали со складовой таблицей Зайцева.", "id": "reading-2025-09-05-0"}, {"date": "8 сентября 2025", "iso": "2025-09-08", "text": "Формирование навыков чтения:\n🔹 продолжили работать со складовой таблицей Зайцева, учились читать и писать по таблице короткие слова.", "id": "reading-2025-09-08-0", "edited": true}, {"date": "10 сентября 2025", "iso": "2025-09-10", "text": "Формирование навыков чтения:\n🔹 продолжили работу со складовой таблицей Зайцева, учились читать и писать слова из 3-х букв по таблице.", "id": "reading-2025-09-10-0"}, {"date": "11 сентября 2025", "iso": "2025-09-11", "text": "Овладение звуко-буквенными обозначениями. Буквы, обозначающие гласные звуки:\n🔹 выполнили речевую разминку (стихи, скороговорки, выделение гласных на слух);\n🔹 повторили все гласные, читали «лесенку» букв;\n🔹 находили в словах гласные и выписывали их.", "id": "reading-2025-09-11-0", "edited": true}, {"date": "12 сентября 2025", "iso": "2025-09-12", "text": "Овладение звуко-буквенными обозначениями. Гласные звуки:\n🔹 провели речевую разминку;\n🔹 развивали фонематический слух;\n🔹 искали гласные звуки в начале слова, выписывали найденное.", "id": "reading-2025-09-12-0", "edited": true}, {"date": "15 сентября 2025", "iso": "2025-09-15", "text": "Овладение звуко-буквенными обозначениями. Гласные звуки:\n🔹 соотнесли буквы со звуками;\n🔹 познакомилисьс кубиками Зайцева, учились классифицировать их по размеру(твёрдые/мягкие), по цвету(гласные/согласн.звонкие/согласн.глухие).", "id": "reading-2025-09-15-0", "edited": true}, {"date": "17 ва - предметы. Число слов - предметов:\n🔹 читали слова, продолжили отрабатывать умение определять число имён существительных;\n🔹 учились изменять существительные по числам: стол - столы (Игра с мячом).", "id": "reading-2026-02-13-0"}, {"date": "25 февраля 2026", "iso": "2026-02-25", "text": "Чтение слов. Работа со складовой таблицей Зайцева:\n🔹 писали слова-предметы по таблице (Игра \"Придумай слово\");\n🔹 закрепляли умение задавать вопрос кто? или что? к слову, опираясь на понятия \"живое\", \"неживое\", образовывать формы мн. ч.", "id": "reading-2026-02-25-0", "edited": true}, {"date": "26 февраля 2026", "iso": "2026-02-26", "text": "Слова - предметы. Род имён существительных:\n🔹 прослушали грамматическую сказку «Как у слов род появился»;\n🔹 читали слова, определяли род имён существительных, пользуясь словами - помощниками (он, она, оно).", "id": "reading-2026-02-26-0"}, {"date": "27 февраля 2026", "iso": "2026-02-27", "text": "Слова - предметы. Род имён существительных:\n🔹 читали слова - предметы, отрабатывали навык определения рода имён существительных (Игра «Помощник»).", "id": "reading-2026-02-27-0"}, {"date": "4 марта 2026", "iso": "2026-03-04", "text": "Слова - предметы. Собственные имена существительные:\n🔹 вспомнили термин «собственные» имена существительные, учились использовать их в речи;\n🔹 развивали умение правильно употреблять заглавные и строчные буквы.", "id": "reading-2026-03-04-0"}, {"date": "5 марта 2026", "iso": "2026-03-05", "text": "Слова-предметы:\n🔹 совершенствовали навык словообразования слов-предметов с уменьшительно-ласкательными суффиксами;\n🔹 читали слова-предметы, образовывали новые формы.", "id": "reading-2026-03-05-0"}, {"date": "6 марта 2026", "iso": "2026-03-06", "text": "Чтение слов. Повторение:\n🔹 продолжили совершенствовать навык словообразования слов-предметов с увеличительными суффиксами;\n🔹 читали слова-предметы, образовывали новые формы.", "id": "reading-2026-03-06-0", "edited": true}, {"date": "9 марта 2026", "iso": "2026-03-09", "text": "Чтение слов:\n🔹 познакомились с понятием \"многозначные слова\";\n🔹 читали слова, учились формулировать значения слов;\n🔹 вставляли пропущенные буквы (Игра \"Буквы потерялись\").", "id": "reading-2026-03-09-0", "edited": true}, {"date": "11 марта 2026", "iso": "2026-03-11", "text": "Слова-предметы. Итоговое занятие:\n🔹 обобщали и систематизировали знания по теме;\n🔹 учились делать первичный морфологический разбор существительных, называя постоянные и непостоянные признаки (од./неод., собств., число, род - слово-помощник).", "id": "reading-2026-03-11-0"}, {"date": "12 марта 2026", "iso": "2026-03-12", "text": "Основы морфологии. Слова-признаки:\n🔹 познакомились со словами, обозначающие признак предмета;\n🔹 читали слова-признаки.\nразвивали навык подбора к слову-признаку слово-предмет, обращали внимание на \"хвостики\" (окончания) прилагательных;", "id": "reading-2026-03-12-0"}, {"date": "13 марта 2026", "iso": "2026-03-13", "text": "Чтение слов. Слова-признаки:\n🔹 продолжили знакомиться с понятием \"признак предмета\", убедились, что такие слова описывают предмет с разных сторон;\n🔹 учились понимать значение прилагательных (по форме, цвету, материалу и т.д).", "id": "reading-2026-03-13-1", "edited": true}, {"date": "16 марта 2026", "iso": "2026-03-16", "text": "Чтение слов. Слова-признаки.\nСинонимы:\n🔹 формировали умение подбирать слова-признаки близкие по значению;\n🔹 читали слова, составляли синонимичные пары.", "id": "reading-2026-03-16-0", "edited": true}, {"date": "18 марта 2026", "iso": "2026-03-18", "text": "Слова-признаки. Антонимы:\n🔹 формировали умение понимать слова с противоположным по смыслу значением;\n🔹 читали слова-признаки, учились подбирать слова противоположные по смыслу.", "id": "reading-2026-03-18-0"}, {"date": "19 марта 2026", "iso": "2026-03-19", "text": "Словосочетания:\n🔹 познакомились с понятием \"словосочетание\", выявили основную функцию словосочетания в речи — называть что-либо более подробно, чем слово;\n🔹 читали словосочетания сущ+прилаг.", "id": "reading-2026-03-19-0"}, {"date": "20 марта 2026", "iso": "2026-03-20", "text": "Слова-признаки:\n🔹 читали слова-признаки и слова-предметы;\n🔹 развивали навык подбора признаков с помощью вопросов, соединяли слова-предметы и слова-признаки по смыслу.", "id": "reading-2026-03-20-0"}, {"date": "23 марта 2026", "iso": "2026-03-23", "text": "Число слов-признаков:\n🔹 познакомились с понятием «число слова-признака;\n🔹 учились определять число имён прилагательных, изменять имена прилагательные по числам.", "id": "reading-2026-03-23-0"}, {"date": "25 марта 2026", "iso": "2026-03-25", "text": "Число слов-признаков:\n🔹 систематизировали знания о числе имён прилагательных;\n🔹 продолжили упражняться в определении числа имён прилагательных, изменять прилагательные по числам.", "id": "reading-2026-03-25-0"}, {"date": "26 марта 2026", "iso": "2026-03-26", "text": "Слова-признаки. Согласование в роде со словами-предметами:\n🔹 формировали умение задавать вопросы к прилагательным, правильно проговаривать окончания;\n🔹 учились различать род имён прилагательных по вопросу и по роду имён существительных.", "id": "reading-2026-03-26-0"}, {"date": "27 марта 2026", "iso": "2026-03-27", "text": "Слова-признаки. Согласование в роде со словами-предметами:\n🔹 учились подбирать к словам-признакам подходящие по смыслу и грамматически слова-предметы;\n🔹 учились задавать вопросы к прилагательным.", "id": "reading-2026-03-27-0", "edited": true}, {"date": "6 апреля 2026", "iso": "2026-04-06", "text": "Слова-признаки. Итоговое занятие:\n🔹 обобщали и систематизировали знания по теме;\n🔹 читали словосочетания, учились согласовывать существительные и прилагательные в роде и числе.", "id": "reading-2026-04-06-0"}, {"date": "8 апреля 2026", "iso": "2026-04-08", "text": "Слова-действия:\n🔹 учились различать слова, обозначающие предмет и действие предмета;\n🔹 читали слова-действия, учились задавать вопросы.", "id": "reading-2026-04-08-0"}, {"date": "9 апреля 2026", "iso": "2026-04-09", "text": "Слова-действия:\n🔹 продолжили читать слова-действия;\n🔹 учились задавать вопросы, подбирать по смыслу и грамматически подходящие существительные.", "id": "reading-2026-04-09-0"}, {"date": "15 апреля 2026", "iso": "2026-04-15", "text": "Слова-действия:\n🔹 формировали умение распознавать глаголы, умение задавать вопросы;\n🔹 развивали представления об употреблении глаголов в единственном и множественном числе.", "id": "reading-2026-04-15-0"}, {"date": "16 апреля 2026", "iso": "2026-04-16", "text": "Слова-действия:\n🔹 продолжили знакомиться с единственным и множественным числом глаголов;\n🔹 развивали умение изменять глаголы по числам.", "id": "reading-2026-04-16-0"}, {"date": "17 апреля 2026", "iso": "2026-04-17", "text": "Слова-действия:\n🔹 получили общие сведения об изменении слов-действий (по лицам и числам);\n🔹 учились изменять слова-действия в настоящем времени (спрягать).", "id": "reading-2026-04-17-0"}, {"date": "20 апреля 2026", "iso": "2026-04-20", "text": "Предложение:\n🔹 познакомились с понятием \"предложение\", учились различать слова и предложения;\n🔹 читали простые нераспространенные предложения, работали над пониманием прочитанного.", "id": "reading-2026-04-20-0"}, {"date": "22 апреля 2026", "iso": "2026-04-22", "text": "Предложение:\n🔹 познакомились с понятием \"графическая схема предложения\";\n🔹 читали предложения, тренировались составлять графические схемы.", "id": "reading-2026-04-22-0"}, {"date": "23 апреля 2026", "iso": "2026-04-23", "text": "Предложение:\n🔹 учились понимать интонационную законченность предложения;\n🔹 читали предложения, учились дифференцировать слова и предложения.", "id": "reading-2026-04-23-0"}, {"date": "24 апреля 2026", "iso": "2026-04-24", "text": "Предложение:\n🔹 продолжили работу с графическими схемами предложений, тренировались изображать схемы предложений из 3-х, 4-х слов с предлогами;\n🔹 продолжили читать предложения (Игра \"Когда это бывает?\").", "id": "reading-2026-04-24-0"}, {"date": "27 апреля 2026", рон, сделали вывод, что у многоугольника число сторон и число углов одинаковое.", "id": "math-2025-10-28-0"}, {"date": "29 октября 2025", "iso": "2025-10-29", "text": "Число 7. Цифра 7:\n🔹 сравнивали группы предметов, соотносили количество с числом, использовали знаки;\n🔹 дополняли числовой ряд (прямой и обратный) числами, опираясь на соседей числа;\n🔹 дописывали равенства с опорой на числовой отрезок, решали примеры.", "id": "math-2025-10-29-0"}, {"date": "3 ноября 2025", "iso": "2025-11-03", "text": "Число 7. Цифра 7:\n🔹 продолжили работу над составом числа 7, раскладывали число разными способами, оформляли выражения;\n🔹 решали примеры.", "id": "math-2025-11-03-0"}, {"date": "4 ноября 2025", "iso": "2025-11-04", "text": "Число 7. Цифра 7:\n🔹 решали примеры, опираясь на числовой отрезок-схему;\n🔹 дорисовывали к картинкам схемы, дописывали равенства;\n🔹 продолжили измерять длины отрезков.", "id": "math-2025-11-04-0"}, {"date": "5 ноября 2025", "iso": "2025-11-05", "text": "Число 7. Цифра 7:\n🔹 рассматривали числовые отрезки, записывали ответы;\n🔹 решали примеры, подбирали пары с одинаковыми ответами.", "id": "math-2025-11-05-0"}, {"date": "10 ноября 2025", "iso": "2025-11-10", "text": "Отработка вычислительных навыков. Повторение:\n🔹 повторили состав чисел 5, 6, 7;\n🔹 решали примеры, раскрашивали фрагменты, подбирая цвет по результатам вычислений.", "id": "math-2025-11-10-0"}, {"date": "12 ноября 2025", "iso": "2025-11-12", "text": "Отработка вычислительных навыков. Повторение:\n🔹 закрепляли знания состава чисел 5-7;\n🔹 решали примеры (игра \"Найди ответ\").", "id": "math-2025-11-12-0"}, {"date": "24 ноября 2025", "iso": "2025-11-24", "text": "Тяжелее, легче. Сравнение по массе:\n🔹 формировали представления о понятиях \"тяжелее-легче\" на основе непосредственного сравнения предметов по массе;\n🔹 закрепляли понимание взаимосвязи целого и частей, решали примеры на состав пройденных чисел.", "id": "math-2025-11-24-0"}, {"date": "25 ноября 2025", "iso": "2025-11-25", "text": "Повторение:\n🔹 повторили смысл сложения и вычитания, исправили ошибки, которые допустил Незнайка;\n🔹 для каждого равенства называли части и целое, дописывли равенства.", "id": "math-2025-11-25-0"}, {"date": "1 декабря 2025", "iso": "2025-12-01", "text": "Измерение массы:\n🔹 формировали представление о необходимости выбора мерки при измерении массы;\n🔹 познакомились с меркой 1 кг;\n🔹 закрепляли смысл сложения и вычитания, решали примеры.", "id": "math-2025-12-01-0"}, {"date": "2 декабря 2025", "iso": "2025-12-02", "text": "Измерение массы. Повторение:\n🔹 закрепили представления о свойствах предметов, понимание взаимосвязи целого и частей;\n🔹 закрепили знание состава числа 7 (Игра \"Тянем-потянем\").", "id": "math-2025-12-02-0"}, {"date": "3 декабря 2025", "iso": "2025-12-03", "text": "Измерение массы. Повторение:\n🔹 продолжили закреплять понимание взаимосвязи целого и частей, умение составлять задачи по рисункам и соотносить их со схемами;\n🔹 закрепляли представления о геометрических фигурах, пространственные отношения  на-под.", "id": "math-2025-12-03-0"}, {"date": "8 декабря 2025", "iso": "2025-12-08", "text": "Измерение массы. Практическая работа:\n🔹 узнали, какие разные бывают весы;\n🔹 используя напольные весы, провели практическую работу, измеряли массу своего тела;\n🔹 формировали представления о понятиях \"тяжелее\", \"легче\", сравнивали массы.", "id": "math-2025-12-08-0"}, {"date": "9 декабря 2025", "iso": "2025-12-09", "text": "Число 8. Цифра 8:\n🔹 познакомились с образованием и составом числа 8, цифрой 8;\n🔹 отрабатывали навык устного счёта в пределах 8.", "id": "math-2025-12-09-0"}, {"date": "10 декабря 2025", "iso": "2025-12-10", "text": "Число 8. Цифра 8:\n🔹 закрепляли понимание взаимосвязи целого и частей, представления о составе числа 8;\n🔹 закрепляли геометрические представления детей, умение находить закономерности.", "id": "math-2025-12-10-0"}, {"date": "15 декабря 2025", "iso": "2025-12-15", "text": "Число 8. Цифра 8:\n🔹 формировали счётные умения в пределах 8;\n🔹 закрепляли умение использовать числовой отрезок для устных вычислений.", "id": "math-2025-12-15-0"}, {"date": "16 декабря 2025", "iso": "2025-12-16", "text": "Повторение:\n🔹 закрепляли умение сравнивать и уравнивать величины по массе (утёнок и зайчонок);\n🔹 составляли неравенства и равенства;\n🔹 решали примеры на состав чисел до 8.", "id": "math-2025-12-16-0"}, {"date": "20 декабря 2025", "iso": "2025-12-20", "text": "Повторение:\n🔹 закрепляли понимание того, что на вопросы \"На сколько больше/меньше?\" отвечают оставшиеся без пары элементы;\n🔹 закрепляли состав числа 8, закрепляли счётные умения в пределах 8.", "id": "math-2025-12-20-0"}, {"date": "24 декабря 2025", "iso": "2025-12-24", "text": "Число 8. Цифра 8:\n🔹 закрепляли взаимосвязь целого и частей;\n🔹 заполняли домик числа 8, проговаривали все возможные варианты.", "id": "math-2025-12-24-0"}, {"date": "12 января 2026", "iso": "2026-01-12", "text": "Число 8. Цифра 8:\n🔹 использовали числовой отрезок для закрепления взаимосвязи части и целого, дополняли схемы и выражения задач;\n🔹 формировали способность к упорядоченному перебору вариантов, располагали картинки в таблице разными способами;\n🔹 закрепляли состав числа 8.", "id": "math-2026-01-12-0"}, {"date": "13 января 2026", "iso": "2026-01-13", "text": "Объём. Сравнение по объёму.\nПрактическая работа:\n🔹 формировали представления об объёме (вместимости), сравнивали сосуды по объёму с помощью переливания;\n🔹 закрепляли счётные умения в пределах 8, решали примеры.", "id": "math-2026-01-13-0"}, {"date": "14 января 2026", "iso": "2026-01-14", "text": "Повторение:\n🔹 закрепляли взаимосвязи целого и частей, решали примеры с разным уровнем сложности;\n🔹 закрепляли умение различать треугольники и четырёхугольники, развивали мелкую моторику руки.", "id": "math-2026-01-14-0"}, {"date": "19 января 2026", "iso": "2026-01-19", "text": "Объём. Сравнение по объёму:\n🔹 вспомнили приём сравнения сосудов по объёму (высота сосуда и ширина дна);\n🔹 закрепляли представления о составе чисел 6-8.", "id": "math-2026-01-19-0"}, {"date": "21 января 2026", "iso": "2026-01-21", "text": "Состав чисел 5-8. Повторение:\n🔹 заполняли домики чисел у доски и самостоятельно;\n🔹 решали примеры на сложение и вычитание.", "id": "math-2026-01-21-0"}, {"date": "26 января 2026", "iso": "2026-01-26", "text": "Число 9. Цифра 9:\n🔹 познакомились с образованием и составом числа 9, цифрой 9;\n🔹 закрепляли умение находить взаимосвязь целого и частей (Игра \"Тянем-потянем\"), сложение и вычитание на числовом отрезке.\nНеделя сербской культуры:\n🔹 познакомились с историей национального сербского костюма;\n🔹 рассмотрели предметы народного творчества;\n🔹 танцевали национальный танец \"Коло\".", "id": "math-2026-01-26-0"}, {"date": "27 января 2026", "iso": "2026-01-27", "text": "Число 9. Цифра 9:\n🔹 продолжили работу над составом числа 9, используя понятия \"часть\" и \"целое\";\n🔹 закрепляли умение находить сходства и различия фигур;\n🔹 закрепляли счётные умения в пределах 9, подбирали нужные знаки.", "id": "math-2026-01-27-0", "edited": true}, {"date": "28 января 2026", "iso": "2026-01-28", "text": "Число 9. Цифра 9:\n🔹 познакомились с циферблатом часов, сформировали представления об определении времени по часам;\n🔹 закрепляли счёт в пределах 9, решали примеры на сложение и вычитание.", "id": "math-2026-01-28-0"}, {"date": "2 февраля 2026", "iso": "2026-02-02", "text": "Число 9. Цифра 9:\n🔹 отрабатывали умение группировать предметы по общим свойствам, закрепляли взаимосвязь целого и его частей;\n🔹 закрепляли пространственные отношения, формировали представления об упорядоченном переборе вариантов.", "id": "math-2026-02-02-0"}, {"date": "3 февраля 2026", "iso": "2026-02-03", "text": "Число 9. Цифра 9:\n🔹 повторили приём сравнения чисел на предметной основе (составление пар);\n🔹 закрепляли представления о составе числа 9 с помощью числового отрезка.", "id": "math-2026-02-03-0"}, {"date": "4 февраля 2026", "iso": "2026-02-04", "text": "Число 9. Цифра 9:\n🔹 повторяли взаимосвязь целого и частей, закрепляли умение использовать схемы для обоснования решения;\n🔹 решали примеры на сложение и вычитание в пределах 9.", "id": "math-2026-02-04-0"}, {"date": "9 февраля 2026", "iso": "2026-02-09", "text": "Отработка вычислительных навыков:\n🔹 использовали математические раскраски, выполняли вычисления, подбирая цвет по результатам вычислений.", "id": "math-2026-02-09-0"}, {"date": "10 февраля 2026", "iso": "2026-02-10", "text": "Отработка вычислительных навыков. Повторение:\n🔹 закрепляли состав чисел 6, 7, 8, 9;\n🔹 решали примеры на сложение и вычитание (Игра \"Где ответ?\").", "id": "math-2026-02-10-0"}, {"date": "11 февраля 2026", "iso": "2026-02-11", "text": "Отработка вычислительных навыков. Повторение:\n🔹 закрепляли состав чисел 5-9;\n🔹 решали примеры на сложение и вычитание (Игра \"Марафон\").", "id": "math-2026-02-11-0"}, {"date": "24 февраля 2026", "iso": "2026-02-24", "text": "Площадь. Измерение площади:\n🔹 формировали представления о площади фигур, сравнении фигур по площади непосредственно и с помощью условной мерки;\n🔹 сделали вывод, что при сравнении фигур по площади мерки должны быть одинаковыми.", "id": "math-2026-02-24-0"}, {"date": "25 февраля 2026", "iso": "2026-02-25", "text": "Площадь. Измерение площади. Повторение:\n🔹 вспомнили новое свойство фигуры - площадь;\n🔹 закрепляли умение составлять задачи по картинкам и соотносить их со схемами;\n🔹 закрепляли знания состава чисел 8 и 9.", "id": "math-2026-02-25-0"}, {"date": "3 марта 2026", "iso": "2026-03-03", "text": "Измерение площади:\n🔹 закрепляли приём сравнения фигур по площади с помощью мерки, познакомились с общепринятой единицей измерения площади - квадратным сантиметром;\n🔹 закрепляли умение переходить от действий с предметами к действиям с числами.", "id": "math-2026-03-03-0"}, {"date": "4 марта 2026", "iso": "2026-03-04", "text": "Измерение площади. Повторение:\n🔹 восстанавливали числовой ряд в прямом и обратном порядке;\n🔹 закрепляли знание с ыми правилами при письме (правильная поза, положение рук, положение прописи);\n🔹 познакомились с понятиями \"клетка\", \"правый верхний угол\", \"левый нижний угол\" и т.д.", "id": "writing-2025-09-04-0", "edited": true}, {"date": "4 сентября 2025", "iso": "2025-09-04", "text": "Цифровая каллиграфия:\n🔹 познакомились с клеткой и её сторонами;\n🔹 продолжили работать с клеткой, учились видеть её пределы (прописи 1).", "id": "writing-2025-09-02-0", "edited": true}, {"date": "9 сентября 2025", "iso": "2025-09-09", "text": "Цифровая каллиграфия:\n🔹 вспомнили основные правила письма (правильная поза, положение рук и т.д.);\n🔹 продолжили работу с клеткой;\n🔹 всомнили основные способы штриховки.", "id": "writing-2025-09-09-0"}, {"date": "11 сентября 2025", "iso": "2025-09-11", "text": "Цифровая каллиграфия:\n🔹 индивидуально прорабатывали положение карандаша в руке;\n🔹 вспомнили основные правила письма (правильная поза, положение рук и т.д.);\n🔹 продолжили работу с клеткой (прописи 2).", "id": "writing-2025-09-11-0"}, {"date": "16 сентября 2025", "iso": "2025-09-16", "text": "Цифровая каллиграфия. Развитие графических навыков:\n🔹 продолжили работу в прописях (прописи 3);\n🔹 писали графические \"узоры\", пользуясь образцами.", "id": "writing-2025-09-16-0"}, {"date": "18 сентября 2025", "iso": "2025-09-18", "text": "Тренировка графических навыков. Математические прописи Шевелёва К.В.   1 часть, стр 1:\n🔹 учились копировать простые фигуры;\n🔹 прописывали узоры по линиям.", "id": "writing-2025-09-18-0"}, {"date": "22 сентября 2025", "iso": "2025-09-22", "text": "Тренировка графических навыков. Математические прописи Шевелёва К.В.   1 часть, стр 1:\n🔹 учились копировать простые фигуры;\n🔹 прописывали узоры по линиям.", "id": "writing-2025-09-22-0"}, {"date": "23 сентября 2025", "iso": "2025-09-23", "text": "Математические прописи Шевелёва 1 часть стр 2:\n🔹 познакомились с алгоритмом написания цифры 1;\n🔹 учились писать цифру 1;\n🔹 отрабатывали умение ориентироваться на листе бума имеры.", "id": "writing-2026-04-20-0"}, {"date": "23 апреля 2026", "iso": "2026-04-23", "text": "Тренировка графических навыков. Повторение:\n🔹 повторили алгоритм написания пройденных цифр;\n🔹 упражнялись в написании двузначных чисел, знаков и узоров в тетрадях в крупную клетку.", "id": "writing-2026-04-23-0"}, {"date": "27 апреля 2026", "iso": "2026-04-27", "text": "Число 10. Математические прописи Шевелёва ч.1 стр.29:\n🔹 продолжили отрабатывать навык написания пройденных цифр;\n🔹 продолжили учиться оформлять неравенства и решения задач.", "id": "writing-2026-04-27-0"}, {"date": "30 апреля 2026", "iso": "2026-04-30", "text": "Графический диктант:\n🔹 учились точно следовать пошаговой инструкции;\n🔹 закрепляли понятия направления и счёта (на сколько клеток двигаться);\n🔹 тренировали усидчивость и аккуратность.", "id": "writing-2026-04-30-0"}, {"date": "4 мая 2026", "iso": "2026-05-04", "text": "Графический диктант:\n🔹 продолжили учиться ориентироваться на листе бумаги (вверх/вниз, вправо/влево, по диагонали);\n🔹 закрепляли навыки проведения прямых линий по диагонали.", "id": "writing-2026-05-04-0"}, {"date": "7 мая 2026", "iso": "2026-05-07", "text": "Буквенная каллиграфия:\n🔹 познакомились с понятием \"рабочая строка\", учились находить пределы рабочей строки.", "id": "writing-2026-05-07-0"}, {"date": "18 мая 2026", "iso": "2026-05-18", "text": "Буквенная каллиграфия:\n🔹 познакомились с элементом \"уголок-локоток\" (крючковая наклонная), отрабатывали алгоритм его написания;\n🔹 закрепляли умение непрерывного написания элемента.\n💃🕺Репетиция выпускного праздника:\n🔹 продолжили подготовку к празднику, отрабатывали песни, движения и стихи;\n🔹 особое внимание уделили слаженности, старались начинать и заканчивать вместе, слушать музыку и держать ритм.", "id": "writing-2026-05-18-0"}, {"date": "19 мая 2026", "iso": "2026-05-19", "text": "Буквенная каллиграфия:\n🔹 познакомились с понятиями \"верхняя и нижняя дополнительная рабочая строка\";\n🔹 тренировались в написании длинных и коротких прямых наклонных линий.\n💃🕺Подготовка к Выпускному празднику:\n🔹 провели репетицию стихотворного монтажа, работали над вырзительностью;\n🔹 продолжили отрабатывать танец и песни.", "id": "writing-2026-05-19-0"}, {"date": "21 мая 2026", "iso": "2026-05-21", "text": "Буквенная каллиграфия:\n🔹 закрепляли умение непрерывного написания крючковой наклонной линии;\n🔹 тренировались в написании длинных и коротких прямых наклонных линий.", "id": "writing-2026-05-21-0"}, {"date": "22 мая 2026", "iso": "2026-05-22", "text": "Буквенная каллиграфия:\n🔹 познакомились с алгоритмом написания строчной буквы \"и\";\n🔹 сравнили печатную и письменную буквы, отрабатывали навык написания.", "id": "writing-2026-05-22-0"}, {"date": "25 мая 2026", "iso": "2026-05-25", "text": "Буквенная каллиграфия:\n🔹 познакомились с алгоритмом написания строчной буквы «ш», формировали навык правильного написания буквы;\n🔹 тренировали написание пройденных элементов.", "id": "writing-2026-05-25-0"}], "Окружающий мир": [{"date": "1 сентября 2025", "iso": "2025-09-01", "text": "Знакомство и формы приветствия:\n🔹 вспомнили ритуал знакомства, используя речевые обороты \"рад знакомству\", \"приятно познакомиться\";\n🔹 узнали как приветствуют друг друга люди других стран.", "id": "world-2025-09-01-0"}, {"date": "4 сентября 2025", "iso": "2025-09-04", "text": "Правила безопасного поведения на улице:\n🔹 обсудили правила поведения на улице, используя разноцветные сигналы Да/Нет;\n🔹 вспомнили основные правила дорожного движения;\n🔹 отрабатывали навыки сотрудничества и взаимопонимания.", "id": "world-2025-09-04-0"}, {"date": "4 сентября 2025", "iso": "2025-09-04", "text": "Правила безопасного поведения на улице:\n🔹 обсудили правила поведения на улице, используя сигналы Да/Нет;\n🔹 вспомнили основные правила дорожного движения;\n🔹 отрабатывали навыки сотрудничества и взаимопонимания.", "id": "world-2025-09-04-1"}, {"date": "9 сентября 2025", "iso": "2025-09-09", "text": "Осень:\n🔹 повторили осенние месяцы;\n🔹 обсудили признаки осени: как меняется природа и погода? Что делают животные? Что делают люди?\n🔹 посмотрели познавательный мультфильм «Кубокот. Времена года».\n— выполнили задание на внимательность: помогли белочке посчитать запасы.", "id": "world-2025-09-09-0"}, {"date": "11 сентября 2025", "iso": "2025-09-11", "text": "Неживая природа: вода:\n🔹 вспомнили, что такое живая и неживая природа;\n🔹 ответили на вопрос: зачем и кому нужна вода?\n🔹 вспомнили различие морской и речной воды;\n🔹 обсудили, как мы можем беречь природу и не загрязнять воду.", "id": "world-2025-09-11-0"}, {"date": "16 сентября 2025", "iso": "2025-09-16", "text": "Неживая природа. Воздух:\n🔹 что такое воздух и зачем он нужен?\n🔹 провели эксперимент — «увидели» воздух в стакане при погружении в воду;\n🔹 изучили свойства воздуха: занимает ли он место? Имеет ли он вес?", "id": "world-2025-09-16-0"}, {"date": "18 сентября 2025", "iso": "2025-09-18", "text": "Технологический прогресс. Бытовая техника:\n🔹 обсуждали, зачем нужны бытовые электроприборы;\n🔹 узнали, откуда берется электричество;\n🔹 что было до изобретения электричества;\n🔹 играли в «Найди лишнее» и «Найди пару».", "id": "world-2025-09-18-0"}, {"date": "23 сентября 2025", "iso": "2025-09-23", "text": "Осень в лесу:\n🔹 углубили и конкретизировали представление об условиях жизни растений, животных и птиц осенью;\n🔹 воспитывали бережное отношение к природе.", "id": "world-2025-09-23-0"}, {"date": "25 сентября 2025", "iso": "2025-09-25", "text": "Технический прогресс, современный транспорт:\n🔹 разобрали виды транспорта;\n🔹 вспомнили профессии, которые связаны с транспортом;\n🔹 повторили правила светофора;\n🔹 узнали историю появления автомобилей.", "id": "world-2025-09-25-0"}, {"date": "30 сентября 2025", "iso": "2025-09-30", "text": "Взаимосвязи в природе:\n🔹 читали сказку «Сова» В.Бианки;\n🔹 познакомились с понятием «пищевая цепочка»;\n🔹 формировали понятие о том, что все в природе взаимосвязано;\n🔹 повторяли правила поведения в лесу.", "id": "world-2025-09-30-0"}, {"date": "2 октября 2025", "iso": "2025-10-02", "text": "Тема: П\nриродные явления:\n🔹 познакомились с природными явлениями (роса, туман, ветер, облака, гроза, град, извержение вулкана);\n🔹 развивали способность анализировать и находить причинно-следственные связи.", "id": "world-2025-10-02-0"}, {"date": "9 октября 2025", "iso": "2025-10-09", "text": "по дороге в парк:\n🔹 обсуждали тему деревьев;\n🔹 познакомились с понятиями \"паразит\" и \"симбиоз\", узнали, как разные растения и животные могут сосуществовать и помогать друг другу.", "id": "world-2025-10-09-0"}, {"date": "14 октября 2025", "iso": "2025-10-14", "text": "Здоровье человека: правильное питание:\n🔹 отвечали на опросы: что такое здоровье? Как быть здоровым?\n🔹 обсудили правила правильного питания, составляли пирамиду полезных продуктов;\n🔹 рассмотрели строение пищеварительного тракта.", "id": "world-2025-10-14-0"}, {"date": "16 октября 2025", "iso": "2025-10-16", "text": "Здоровье человека.\nЧто такое здоровье? Можно ли его купить:\n🔹 рассмотрели основные составляющие здоровья: правильное питание, здоровый сон, спорт, личная гигиена, чистая окружающая среда.", "id": "world-2025-10-16-0"}, {"date": "23 октября 2025", "iso": "2025-10-23", "text": "Домашние и дикие животные: 🔹отвечали на вопросы: Как проходило одомашнивание?\nЗачем одомашнили животных:\n🔹 рассматривали изображения домашних и диких животных, обсуждали особенности их поведения и внешнего вида.", "id": "world-2025-10-23-0"}, {"date": "30 октября 2025", "iso": "2025-10-30", "text": "Глобус, карта:\n🔹 искали ответы на вопросы: что такое глобус, зачем он нужен? Чем глобус отличается от карты?\n🔹 познакомились с понятием «материк»;\n🔹 учили названия материков.", "id": "world-2025-10-30-0"}, {"date": "4 ноября 2025", "iso": "2025-11-04", "text": "Тема: Материки. Евразия:\n🔹 повторили названия материков;\n🔹 получили представление о том, что Евразия делится на Европу и Азию, и на одном материке — множество стран;\n🔹 познакомились с животными, населяющими материк;\n🔹 строили контур Евразии, развивали навык командой работы.", "id": "world-2025-11-04-0"}, {"date": "6 ноября 2025", "iso": "2025-11-06", "text": "Рукотворный мир: предметы и материалы. История бумаги:\n🔹 что появилось раньше: бумага или письменность;\n🔹 что использовали люди до изобретения бумаги;\n🔹 изучили процесс создания бумаги;\n🔹 изучили свойства бумаги через эксперименты.", "id": "world-2025-11-06-0"}, {"date": "13 ноября 2025", "iso": "2025-11-13", "text": "Перелетные птицы\nПознакомились с перелетными птицами, дали определение словам «насекомоядные», «водоплавающие». Расширили представления о перелетных птицах, их внешнем виде и образе жизни.", "id": "world-2025-11-13-0"}, {"date": "25 ноября 2025", "iso": "2025-11-25", "text": "Возникновение Земли:\n🔹 узнали, как появилась наша планета;\n🔹 познакомились со строением Земли: ядро, мантия, земная кора;\n🔹 сделали свою модель строения Земли из пластилина.", "id": "world-2025-11-25-0"}, {"date": "27 ноября 2025", "iso": "2025-11-27", "text": "История Земли: эволюция растений и животных:\n🔹 познакомились с первыми на Земле растениями и животными, их развитием и изменением;\n🔹 посмотрели обучающий мультфильм про историю Земли.", "id": "world-2025-11-27-0"}, {"date": "2 декабря 2025", "iso": "2025-12-02", "text": "Экономика: семейный бюджет:\n🔹 получили первоначальные сведения о науке экономике и о значении денег;\n🔹 узнали, что такое семейный бюджет, и как правильно им распоряжаться;\n🔹 развиваем стремление к бережливости, самостоятельности, контролю своих расходов.\n(=потребностей)\n.", "id": "world-2025-12-02-0"}, {"date": "4 декабря 2025", "iso": "2025-12-04", "text": "История денег:\n🔹 обсудили, зачем нужны деньги;\n🔹 узнали, как раньше люди без денег обменивались товарами, познакомились с понятием «товарообмен» (игра «Обмен»);\n🔹 узнали историю денег и рассмотрели изображения первых монет и купюр.", "id": "world-2025-12-04-0"}, {"date": "9 декабря 2025", "iso": "2025-12-09", "text": "Продолжаем развивать свои знания о финансах и финансовой грамотности: дидактическая игра «Магазин».", "id": "world-2025-12-09-0"}, {"date": "16 декабря 2025", "iso": "2025-12-16", "text": "Окружающимй мир\nВремена года: зима:\n🔹 вспомнили времена года, и ответили на вопрос: почему сменяются времена года?\n🔹 узнали, что времена года разные в северном и южном полушарии;\n🔹 познакомились с зимними природными явлениями (снегопад, метель, гололед, изморозь, мороз).", "id": "world-2025-12-16-0"}, {"date": "18 декабря 2025", "iso": "2025-12-18", "text": "Страны и континенты: Антарктида\nпознакомились с частями света, отправились в путешествие на самый Юг — в Антарктиду;\nузнали, что в Антарктиде нет стран и государств, и живут там только ученые;\nпознакомились с животными Антарктиды. Ответили на вопрос: догонит ли белый медведь пингвина?\n🐊 Ходили в гости к группе middle. Играли в зимнего крокодила (шарады). Тренировали навыки логики, индукции, дедукции, артистизма.", "id": "world-2025-12-18-0"}, {"date": "20 декабря 2025", "iso": "2025-12-20", "text": "Профессия: архитектор\nВспомнили, что такое профессия\nПознакомились с работами известных архитекторов\nСоздали чертеж здания, построили дома из лего по чертежу.", "id": "world-2025-12-20-0"}, {"date": "13 января 2026", "iso": "2026-01-13", "text": "Экология\nОтветили на вопросы:\n🔹 что изучает наука экология?\n🔹 от чего мы должны защищать окружающую среду?\n🔹 как мы можем защищать окружающую среду?\nСделали проекты-плакаты «Как мы защищаем природу», выступили перед классом с мини-презентацией.", "id": "world-2026-01-13-0"}, {"date": "22 января 2026", "iso": "2026-01-22", "text": "Профессия: дизайнер.\nУзнали, чем занимаются дизайнеры, и насколько разные у них бывают области работы.\nСоздали свои дизайн-проекты: машины/одежды/мебель.\n🇷🇸 Играем в квиз Угадай животное и что они едят.", "id": "world-2026-01-22-0"}, {"date": "29 января 2026", "iso": "2026-01-29", "text": "Страна Сербия. Выяснили, что такое страна на примере Сербии.\nОбсудили такие отличительные признаки: флаг, язык, валюта, природа, правитель (президент/король), столица, своя территория.", "id": "world-2026-01-29-0"}, {"date": "3 февраля 2026", "iso": "2026-02-03", "text": "Климатические зоны Земли: умеренный климат:\n🔹 рассмотрели глобус, обсудили, почему в разных участках Земли разный климат;\n🔹 рассмотрели умеренный климат: лес, тайга, животные и растения;\n🔹 играли в «найди лишнее».", "id": "world-2026-02-03-0"}, {"date": "5 февраля 2026", "iso": "2026-02-05", "text": "Материки: Африка:\n🔹 нашли материк на карте;\n🔹 вспомнили, какой в Африке климат;\n🔹 узнали про пустыню Сахару и реку Нил;\n🔹 обсудили животных, которые здесь живут.", "id": "world-2026-02-05-0"}, {"date": "10 февраля 2026", "iso": "2026-02-10", "text": "Материки: Африка:\n🔹 повторили, какой климат в Африке, вспомнили про пустыню Сахару и реку Нил;\n🔹 сегодня обсудили интересные растения Африки.", "id": "world-2026-02-10-0"}, {"date": "12 февраля 2026", "iso": "2026-02-12", "text": "Традиции и творчество народов Африки:\n🔹 познакомились с образом жизни народов Африки. Обсудили, как природные условия влияют на быт и культуру;\n🔹 рассмотрели традиционные элементы искусства: яркие цвета, орнаменты;\n🔹 познакомились с африканскими ритмами и танцевали под ритмичную музыку.", "id": "world-2026-02-12-0"}, {"date": "24 февраля 2026", "iso": "2026-02-24", "text": "Вода: ее свойства, экология\nуточнили представление о целостности природного сообщества и о реке как части природы;\nформировали понимание того, что неразумное вмешательство в природу несет серьезные последствия для всех ее частей;\nзакрепляли знания о свойствах воды;\nвоспитываем желание бережно относиться к природе и восхищаться её чудесами.", "id": "world-2026-02-24-0"}, {"date": "26 февраля 2026", "iso": "2026-02-26", "text": "Материки и страны: Австралия 🇦🇺:\n🔹 нашли материк на карте и глобусе, обсудили его отличие от остальных материков;\n🔹 обсудили климатические особенности Австралии, узнали о необычных животных;\n🔹 составили небольшой план путешествия в Австралию, ответив на вопросы: какую одежду брать, на каком транспорте добираться, каких животных мы встретим.", "id": "world-2026-02-26-0"}, {"date": "3 марта 2026", "iso": "2026-03-03", "text": "Материки: Северная и Южная Америка:\n🔹 закрепили представления о местоположении и форме материков;\n🔹 познакомились с флорой и фауной материков;\n🔹 выстраивали связь между климатом и животным миром.", "id": "world-2026-03-03-0"}, {"date": "5 марта 2026", "iso": "2026-03-05", "text": "Материки: повторение и закрепление пройденного:\n🔹 создали свою карту мира со всеми материками;\n🔹 распределили представителей флоры и фауны по материкам.", "id": "world-2026-03-05-0"}, {"date": "10 марта 2026", "iso": "2026-03-10", "text": "Океаны и моря\nпознакомились с понятием «океан» и «море», узнали отличия:\n🔹 нашли 5 океанов на карте и глобусе;\n🔹 познакомились с морскими животными.", "id": "world-2026-03-10-0"}, {"date": "12 марта 2026", "iso": "2026-03-12", "text": "Моря и океаны:\n🔹 закрепили пройденный материал;\n🔹 узнали, почему моря и океаны соленые;\n🔹 познакомились с обитателями морей и океанов на разных глубинах.", "id": "world-2026-03-12-0"}, {"date": "17 марта 2026", "iso": "2026-03-17", "text": "Реки и озера:\n🔹 закрепление пройденного материала по теме моря, океаны;\n🔹 искали ответы на вопросы: откуда берутся реки и озера? Чем реки и озера отличаются от морей/океанов?\n🔹 узнали о самой длинной реке, самом большом и глубоком озерах мира.", "id": "world-2026-03-17-0"}, {"date": "19 марта 2026", "iso": "2026-03-19", "text": "Урок бесконфликтного общения\nразобрали значение слова «конфликт»:\n🔹 разработали способы решения конфликтных ситуаций;\n🔹 театрализация конфликтных ситуаций и путей их решения.", "id": "world-2026-03-19-0"}, {"date": "24 марта 2026", "iso": "2026-03-24", "text": "Жизнь в пресноводных водоемах:\n🔹 закрепили знания о реках и озёрах;\n🔹 познакомились с представителями пресноводного сообщества.", "id": "world-2026-03-24-0"}, {"date": "26 марта 2026", "iso": "2026-03-26", "text": "Свойства воды: плотность, мутность:\n🔹 закрепили знания о морях, океанах, реках, озерах и животных, в них обитающих;\n🔹 провели опыт, отражающий плотность и мутность воды.", "id": "world-2026-03-26-0"}, {"date": "7 апреля 2026", "iso": "2026-04-07", "text": "Тема: Вселенная и космос:\n🔹 познакомились с понятием Вселенной, узнали о Солнечной системе, планетах, звёздах, спутниках и роли Солнца;\n🔹 обсудили, почему планеты не разлетаются в космосе, и закрепили это через наглядный опыт с «силой притяжения».", "id": "world-2026-04-07-0"}, {"date": "9 апреля 2026", "iso": "2026-04-09", "text": "Космос, освоение космоса:\n🔹 закрепили знания о первом полете человека в космос и о Дне космонавтики;\n🔹 узнали о новой космической программе Артемида по возвращению человека на Луну, рассмотрели фотографии обратной стороны Луны и солнечного затмения;\n🔹 обсудили, какие качества нужны человеку, чтобы стать космонавтом.", "id": "world-2026-04-09-0"}, {"date": "14 апреля 2026", "iso": "2026-04-14", "text": "Тело человека: части тела, внутренние органы:\n🔹 повторили названия частей тела и внутренних органов;\n🔹 закрепляли знания о том, зачем нужны те или иные части тела и органы, вспомнили парные части тела;\n🔹 отгадывали загадки, искали ответы на карточках в классе.", "id": "world-2026-04-14-0"}, {"date": "16 апреля 2026", "iso": "2026-04-16", "text": "Тело человека: сердце и кровь:\n🔹 узнали о строении сердца и его роли в организме человека;\n🔹 познакомились с кругами кровообращении и функции крови в организме.", "id": "world-2026-04-16-0"}, {"date": "21 апреля 2026", "iso": "2026-04-21", "text": "Тело человека: лёгкие:\n🔹 познакомились с парным органом — лёгкими;\n🔹 узнали о строении и функции легких;\n🔹 узнали о механике дыхания: воздух толкается засчет движения диафрагмы, рассмотрели модель движения диафрагмы и работы легких.", "id": "world-2026-04-21-0"}, {"date": "23 апреля 2026", "iso": "2026-04-23", "text": "Тело человека: пищеварительная система:\n🔹 узнали, какие органы осуществляют пищеварение;\n🔹 узнали, что пищеварение начинается во рту;\n🔹 познакомились с функциями желудка и кишечника;\n🔹 узнали, почему при отравлении важно пить много воды.", "id": "world-2026-04-23-0"}, {"date": "28 апреля 2026", "iso": "2026-04-28", "text": "Тело человека: мозг — командный центр:\n🔹 познакомились со строением мозга: полушария, нейроны, отделы;\n🔹 узнали, что у каждого отдела мозга — своя функция.", "id": "world-2026-04-28-0"}, {"date": "30 апреля 2026", "iso": "2026-04-30", "text": "Тело человека: органы чувств:\n🔹 узнали, как органы чувств связаны с работой мозга;\n🔹 закрепили знания о зрении и слухе (глаза и уши), о том, как заботиться об остроте слуха и зрения;\n🔹 выполняли задания: искали отличия и играли в игры на развитие слухового восприятия.", "id": "world-2026-04-30-0"}, {"date": "5 мая 2026", "iso": "2026-05-05", "text": "Тело человека: органы чувств (часть 2):\n🔹 закрепили знания о зрении и слухе;\n🔹 познакомились с оставшимися органами чувств: язык, нос, кожа, с их строением и функциями;\n🔹 проверяли свои обоняние и осязание вслепую.", "id": "world-2026-05-05-0"}, {"date": "7 мая 2026", "iso": "2026-05-07", "text": "Тело человека: закрепление:\n🔹 повторили части тела человека, внутренние органы и органы чувств, их строение и основные функции;\n🔹 обсудили, что организм человека работает как единая система;\n🔹 закрепили представления о здоровом образе жизни и способах поддержания здоровья человека.", "id": "world-2026-05-07-0"}, {"date": "21 мая 2026", "iso": "2026-05-21", "text": "Повторение: природа, материки, океаны и их обитатели:\n🔹 закрепили знания о материках и океанах, о животных, которые на них обитают;\n🔹 вспомнили о различиях между живой и неживой природой.", "id": "world-2026-05-21-0"}, {"date": "26 мая 2026", "iso": "2026-05-26", "text": "Итоговое занятие: путешествие по странам мира:\n🔹 закрепили знания о странах, их столицах и государственных символах;\n🔹 провели тур по главным достопримечательностям мира, угадывали по ним страны;\n🔹 закрепили умение составлять рассказ о своём городе.", "id": "world-2026-05-26-0"}, {"date": "28 мая 2026", "iso": "2026-05-28", "text": "Безопасность: на дороге, в лесу, дома:\n🔹 повторили правила дорожного движения, обсудили опасность игр с огнем и закрепили основы безопасности, когда остаешься дома один.\n❤️ Дорогие родители, сегодня у нас был последний учебный день в рамках нашей образовательной программы.\nСпасибо вам за сотрудничество, поддержку, доверие и участие в жизни группы!\nБыло очень приятно пройти этот путь вместе с вами и вашими замечательными детьми.\nДо свидания и до новых встреч! 🌷", "id": "world-2026-05-28-0"}], "Творчество": [{"date": "3 сентября 2025", "iso": "2025-09-03", "text": "Рисунок \"Игрушка, которую я задумала\":\n🔹 учились выделять предметы конкретной формы, цвета и размера, учились отображать их на бумаге;\n🔹 развивали зрительное восприятие.", "id": "art-2025-09-03-0"}, {"date": "8 сентября 2025", "iso": "2025-09-08", "text": "Декоративное рисование на квадрате:\n🔹 учились создавать декоративную композицию на квадрате, ориентируясь на листе бумаги (центр, углы, край, середина).", "id": "art-2025-09-08-0"}, {"date": "10 сентября 2025", "iso": "2025-09-10", "text": "лепка из пластилина «Осенний урожай", "id": "art-2025-09-10-0"}, {"date": "15 сентября 2025", "iso": "2025-09-15", "text": "Аппликация «Ваза с фруктами»:\n🔹 обсудили с ребятами, что такое натюрморт;\n🔹 рассмотрели разные картины: какие эмоции они вызывают;\n🔹 обсуждали теплые и холодные оттенки, их влияние на наши эмоции.", "id": "art-2025-09-15-0"}, {"date": "17 сентября 2025", "iso": "2025-09-17", "text": "Рисуем красками. Осенний пейзаж:\n🔹 использовали разные оттенки, научились технике рисования листьев  штампованием.", "id": "art-2025-09-17-0"}, {"date": "24 сентября 2025", "iso": "2025-09-24", "text": "Аппликация+рисование \"Мельница\":\n🔹 обсуждали как функционирует мельница, зачем ей лопасти;\n🔹 дорисовали на рисунке недостающие элементы.", "id": "art-2025-09-24-0"}, {"date": "24 сентября 2025", "iso": "2025-09-24", "text": "«От зернышка к яблочку»:\n🔹 узнали, как произрастает яблоко, какие этапы проходит растение;\n🔹 обсудили, что нужно для роста: земля, вода, солнце, забота;\n🔹 делали аппликацию, работали с ножницами и деталями;\n🔹 закрепили умение аккуратно вырезать и наклеивать, выполняя последовательность роста яблока.", "id": "art-2025-09-24-1"}, {"date": "29 сентября 2025", "iso": "2025-09-29", "text": "Аппликация. Роботы:\n🔹 продолжая тему технического прогресса (с окружающего мира), дали волю фантазии и воображению, сделали своих роботов из геометрических фигур.", "id": "art-2025-09-29-0"}, {"date": "1 октября 2025", "iso": "2025-10-01", "text": "Декоративное рисование:\n🔹 познакомились с гжелью;\n🔹 рисовали узор на тарелке, учились симметрии.", "id": "art-2025-10-01-0"}, {"date": "6 октября 2025", "iso": "2025-10-06", "text": "Осенний букет:\n🔹 отгадывали, с какого дерева упал каждый листочек;\n🔹 работали с ножницами, аккуратно вырезали листья из цветной бумаги;\n🔹 учились рисовать вазу для листиков.\n☀️ Прогулка:\n🔹 наблюдали за осенними изменениями: искали жёлтые листья, обсуждали, какие деревья уже сбросили листву, а какие ещё стоят зелёными.\n🎬 Для желающих — просмотр мультфильмов и тихие игры\nСмотрели «Бодо Бородо», читали книги, играли в лего и  настольные игры;\n✅Диагностика. Начало учебного года.\nВыявляли:\n🔹 дидактическую готовность (уровень знаний, необходимые навыки и умения);\n🔹 социальную готовность (правила поведения, коммуникативные умения).", "id": "art-2025-10-06-0"}, {"date": "7 октября 2025", "iso": "2025-10-07", "text": "После прогулки ребята лепили белочку из пластилина.\nУчились передавать особенности этого зверька: аккуратно формировали голову, туловище, лапки и пушистый хвост.\nРаботали с мелкими деталями, развивая моторику и внимание.\n🎲 Свободные игры\n🍁Сегодня у нас прошёл настоящий осенний день на природе — ребята отправились в парк!\n🌳 Прогулка и наблюдения:\n🔹 на прогулке ребята узнали, как меняется погода осенью, почему становится прохладнее и как животные готовятся к зиме;\n🔹 говорили о том, как белочка делает запасы: прячет орешки, ищет их, а иногда забывает свои тайники, из которых потом вырастают новые деревья;\n🔹 ребята наблюдали за белочками, рассматривали, как они двигаются и чем заняты;\n🔹 обсудили, почему важно беречь природу — не ломать ветки, не шуметь, не оставлять мусор и помогать сохранять чистоту вокруг.\n🏃‍♂️Игры и ОФП\nФизическая активность прошла в игровой форме прямо на улице — дети участвовали в подвижных играх, соревновались, бегали и смеялись.", "id": "art-2025-10-07-0"}, {"date": "8 октября 2025", "iso": "2025-10-08", "text": "+ окружающий мир:\n🔹 говорили о птицах — перелётных и зимующих;\n🔹 обсудили, почему одни улетают в тёплые края, а другие остаются зимовать;\n🔹 узнали, как птицы готовятся к перелёту и что им помогает преодолевать большие расстояния.\n🕊После беседы началась творческая работа — первый этап создания маски птицы:\n🔹 делали заготовки, вырезали элементы;\n🔹 раскрашивали маску красками;\n🔹 учились аккуратно рисовать, правильно держать кисточку, не выходить за линию.", "id": "art-2025-10-08-0"}, {"date": "9 октября 2025", "iso": "2025-10-09", "text": "🔹 продолжили говорить о птицах, вспомнили перелётных и зимующих;\n🔹 доделывали маски птиц, раскрашивали, приклеивали детали.", "id": "art-2025-10-09-0"}, {"date": "10 октября 2025", "iso": "2025-10-10", "text": "Тема: «Натюрморт»:\n🔹 рисовали овощную тарелку;\n🔹 вспомнили слова: палитра, художник, мольберт;\n🔹 обсуждали, как называют художников, которые рисуют портрет, натюрморт и пейзаж;\n🔹 учились создавать эскиз, учитывая композицию: где расположить предметы, чтобы рисунок выглядел гармонично и красиво;\n🔹 разукрашивали свои работы, подбирая цвета и передавая форму овощей.", "id": "art-2025-10-10-0"}, {"date": "15 октября 2025", "iso": "2025-10-15", "text": "Рисование. Подсолнух:\n🔹 работали красками, рассматривали строение цветка, выделяли основные элементы;\n🔹 учились передавать форму и цвет по образцу;\n🔹 развивали чувство композиции, цветовосприятие и мелкую моторику.", "id": "art-2025-10-15-0"}, {"date": "3 ноября 2025", "iso": "2025-11-03", "text": "Рисование по представлению на тему: Моя любимая игрушка.", "id": "art-2025-11-03-0"}, {"date": "5 ноября 2025", "iso": "2025-11-05", "text": "Рисование: Ветка рябины:\n🔹 делали предварительный набросок карандашом, и работали красками.", "id": "art-2025-11-05-0"}, {"date": "10 ноября 2025", "iso": "2025-11-10", "text": "Рисование с натуры: комнатное растение:\n🔹 стремились к соблюдению пропорций, отображению предмета через простые геометрические формы.", "id": "art-2025-11-10-0"}, {"date": "12 ноября 2025", "iso": "2025-11-12", "text": "Аппликация: осенний ковер\nУчились вырезать предметы симметрично (согнуть бумагу -> обвести шаблон -> вырезать -> разогнуть).", "id": "art-2025-11-12-0"}, {"date": "24 ноября 2025", "iso": "2025-11-24", "text": "Аппликация «Птицы»\nРазвитие мелкой моторики, тренировка навыков работы с ножницами.", "id": "art-2025-11-24-0"}, {"date": "26 ноября 2025", "iso": "2025-11-26", "text": "И.И. Шишкина: «Рожь:\n🔹 познакомились с жизнью и творчеством И.И. Шишкина;\n🔹 формировали умение видеть образ и настроение в картине;\n🔹 учились рассказывать о своих впечатлениях от картины;\n🔹 сами превратились в пейзажистов и постарались перерисовать «Рожь».", "id": "art-2025-11-26-0"}, {"date": "1 декабря 2025", "iso": "2025-12-01", "text": "Рисуем обложку к книге по сказке «Колобок»\nПознакомились с новым видом изобразительного искусства — графикой, работали мелками и карандашами.", "id": "art-2025-12-01-0"}, {"date": "3 декабря 2025", "iso": "2025-12-03", "text": "Знакомство с матрешкой: узнали историю появления игрушки и что она символизирует\nСоздали своих матрешек с помощью техники пластилинографии.", "id": "art-2025-12-03-0"}, {"date": "8 декабря 2025", "iso": "2025-12-08", "text": "Знакомство с хохломой. Посмотрели примеры хохломской росписи, обсудили основные признаки.\nНачали оформлять «дощечку».", "id": "art-2025-12-08-0"}, {"date": "10 декабря 2025", "iso": "2025-12-10", "text": "Продолжаем работу над росписью хохломой.", "id": "art-2025-12-10-0"}, {"date": "11 декабря 2025", "iso": "2025-12-11", "text": "Вырезали снежинки из бумаги\nУчились ровно складывать бумагу по инструкции, делать из прямоугольника квадрат, работали с ножницами.", "id": "art-2025-12-11-0"}, {"date": "15 декабря 2025", "iso": "2025-12-15", "text": "Писали и рисовали письма Деду Морозу.", "id": "art-2025-12-15-0"}, {"date": "17 декабря 2025", "iso": "2025-12-17", "text": "Рисование: снеговик:\n🔹 учились рисовать пропорционально;\n🔹 развивали аккуратность: рисуем красками, не заходя за контур;\n🔹 познакомились с цилиндром и способом его изображения на бумаге.\n🎄Репетиция новогоднего праздника:\n🔹 знакомились с последовательностью выступлений;\n🔹 учились выразительно читать стихи, водить хоровод, вспомнили песню «В лесу родилась ёлочка».", "id": "art-2025-12-17-0"}, {"date": "22 декабря 2025", "iso": "2025-12-22", "text": "Зимний город\nРабота в смешанной технике: акварель и аппликация.", "id": "art-2025-12-22-0"}, {"date": "14 января 2026", "iso": "2026-01-14", "text": "Конструирование: делаем картонную игрушку-лошадку, символ 2026го года!", "id": "art-2026-01-14-0"}, {"date": "19 января 2026", "iso": "2026-01-19", "text": "Знакомство с архитектурой: оформление своего домика мечты, работа карандашами", "id": "art-2026-01-19-0"}, {"date": "21 января 2026", "iso": "2026-01-21", "text": "Групповая работа: проектируем целый город!\nРебята назвали его «Нови Град»", "id": "art-2026-01-21-0"}, {"date": "28 января 2026", "iso": "2026-01-28", "text": "Конструирование: замок из бумаги\nСегодня выполнили первую часть работы: раскрашивали детали замка.", "id": "art-2026-01-28-0"}, {"date": "2 февраля 2026", "iso": "2026-02-02", "text": "Конструирование: замок из бумаги.\nСегодня выполнили вторую часть работы: закончили раскрашивать, приступили к работе ножницами.", "id": "art-2026-02-02-0"}, {"date": "4 февраля 2026", "iso": "2026-02-04", "text": "Конструирование из бумаги: доделали замок! Сегодня мы складывали по линиям, работали с клеем.", "id": "art-2026-02-04-0"}, {"date": "11 февраля 2026", "iso": "2026-02-11", "text": "Знакомство с видом декоративно-прикладного искусства — мозаикой. Сделали валентинку в этой технике.", "id": "art-2026-02-11-0"}, {"date": "18 февраля 2026", "iso": "2026-02-18", "text": "«Разноцветные ноты»:\n🔹 познакомились с нетрадиционной техникой рисования - ватными палочками;\n🔹 создавали изображения с помощью точек, учились аккуратно наносить краску и распределять её по листу.", "id": "art-2026-02-18-0"}, {"date": "19 февраля 2026", "iso": "2026-02-19", "text": "«Кораблик на волнах»:\n🔹 познакомились с техникой оригами;\n🔹 учились внимательно слушать инструкцию, аккуратно выполнять сгибы;\n🔹 развивали мелкую моторику, пространственное мышление, умение следовать пошаговый инструкции, доводить начатое дело до конца.", "id": "art-2026-02-19-0"}, {"date": "23 февраля 2026", "iso": "2026-02-23", "text": "Сделали рисунок для пап, наших супер-героев!", "id": "art-2026-02-23-0"}, {"date": "25 февраля 2026", "iso": "2026-02-25", "text": "Лепка и конструирование:\nмоделирование кота из пластилина.\n— учились передавать форму и пропорции животного; — закрепляли навыки поэтапной лепки; — развивали мелкую моторику и пространственное мышление.", "id": "art-2026-02-25-0"}, {"date": "4 марта 2026", "iso": "2026-03-04", "text": "Создали весенний букет! Работа с бумагой и красками.", "id": "art-2026-03-04-0"}, {"date": "9 марта 2026", "iso": "2026-03-09", "text": "Работа акварелью, техника оригами.\nСделали подснежник.", "id": "art-2026-03-09-0"}, {"date": "11 марта 2026", "iso": "2026-03-11", "text": "Аппликация «пейзаж», использовали технику обрывания бумаги.", "id": "art-2026-03-11-0"}, {"date": "16 марта 2026", "iso": "2026-03-16", "text": "Работа красками, фантазия на тему «Весна пришла».", "id": "art-2026-03-16-0"}, {"date": "18 марта 2026", "iso": "2026-03-18", "text": "Работа красками, фантазия на тему «Весна пришла», заканчиваем работу с прошлого занятия.", "id": "art-2026-03-18-0"}, {"date": "23 марта 2026", "iso": "2026-03-23", "text": "Pixel-art: создаем «пиксельный» рисунок по образцу, работа с бумагой, клеем, ножницами;", "id": "art-2026-03-23-0"}, {"date": "25 марта 2026", "iso": "2026-03-25", "text": "Pixel-art: продолжаем «пиксельный» рисунок по образцу, работа с бумагой, клеем, ножницами.", "id": "art-2026-03-25-0"}, {"date": "30 марта 2026", "iso": "2026-03-30", "text": "🔹 оформили личную карточку спецагента.\n🕺💃 Очень весело играли в играонице.", "id": "art-2026-03-30-0"}, {"date": "31 марта 2026", "iso": "2026-03-31", "text": "🔹 изготовили секретную лупу, с помощью которой завтра мы разгадаем шифр.\n🕺💃 Очень весело играли в играонице.", "id": "art-2026-03-31-0"}, {"date": "1 апреля 2026", "iso": "2026-04-01", "text": "🔹 выполняли творческие задания;\n🔹 расшифровывали слова;\n🔹 искали слова и буквы;\n🔹 читали слова по первым и последним буквам.\n🕺💃 Очень весело играли в играонице.", "id": "art-2026-04-01-0"}, {"date": "2 апреля 2026", "iso": "2026-04-02", "text": ".\nРисунки пальчиками:\n🔹 делали цветные отпечатки, потом из них рисовали животных.\n🎲 Настольные игры:\n\"Найди своего кота\" и \"Вверх тормашками\".", "id": "art-2026-04-02-0"}, {"date": "3 апреля 2026", "iso": "2026-04-03", "text": "\"Фоторобот по описанию\":\n🔹 рисовали персонажа по шуточным инструкциям;\n🔹 развивали внимание, воображение, умение слушать.", "id": "art-2026-04-03-0"}, {"date": "6 апреля 2026", "iso": "2026-04-06", "text": "Работа акварелью ко Дню Космонавтики: космонавт, ловящий звезды. Учимся пропорциям в изображении человека.", "id": "art-2026-04-06-0"}, {"date": "8 апреля 2026", "iso": "2026-04-08", "text": "Солнечная система: сделали свою модель солнечной системы с помощью пластилина.", "id": "art-2026-04-08-0"}, {"date": "15 апреля 2026", "iso": "2026-04-15", "text": "Оригами: птица. Работали с бумагой, закрепляли навык создания квадрата из прямоугольника, отрабатывали ровные линии сгиба.", "id": "art-2026-04-15-0"}, {"date": "20 апреля 2026", "iso": "2026-04-20", "text": "Пейзаж: рисовали дерево из Футошки парка. Делали набросок карандашом, работали красками;", "id": "art-2026-04-20-0"}, {"date": "27 апреля 2026", "iso": "2026-04-27", "text": "Рисование на свободную тему.", "id": "art-2026-04-27-0"}, {"date": "29 апреля 2026", "iso": "2026-04-29", "text": "Делали объемный пейзаж, развивали пространственное мышление и воображение.", "id": "art-2026-04-29-0"}, {"date": "4 мая 2026", "iso": "2026-05-04", "text": "Работа с бумагой: выполнили рыбку в технике плетения;", "id": "art-2026-05-04-0"}, {"date": "6 мая 2026", "iso": "2026-05-06", "text": "Рисовали цветущую сакуру ватными палочками.", "id": "art-2026-05-06-0"}, {"date": "14 мая 2026", "iso": "2026-05-14", "text": "Аппликация:\n«Дракоша»\nСначала раскрашивали детали, затем аккуратно вырезали и собирали дракончика.\nУчились располагать элементы на листе, развивали внимание, аккуратность и мелкую моторику.", "id": "art-2026-05-14-0"}, {"date": "25 мая 2026", "iso": "2026-05-25", "text": "Познакомились с работами В.Васнецова по сказочным мотивам.\nПревратились в его последователей, и нарисовали сказочную избушку на курьих ножках.", "id": "art-2026-05-25-0"}], "Другое": [{"date": "1 сентября 2025", "iso": "2025-09-01", "text": "Меня зовут Елена Евгеньевна. Я буду вести курс \"Подготовка к школе 6-7 лет\".", "id": "other-2025-09-01-0"}, {"id": "other-2025-09-01-1", "iso": "2025-09-01", "date": "1 сентября 2025", "text": "❤️Сегодня мы познакомились не толко друг с другом, но и со школой, со своим кабинетом. Вспомнили некоторые важные правила поведения в школе. Много играли в играонице и на прогулке.", "isNew": true}, {"id": "other-2025-10-14-0", "iso": "2025-11-29", "date": "29 ноября 2025", "text": "❤️ Дорогие мамы,\nпоздравляю вас с Днем матери и желаю душевных сил и жизненной мудрости!  Спасибо вам за то тепло, нежность, ласку и заботу, которые вы так искренне отдаёте детям!", "isNew": true, "edited": true}, {"date": "23 декабря 2025", "iso": "2025-12-23", "text": "Сегодня у нас был весёлый праздник.\nБыло много песен, танцев и конкурсов.\nРебята выразительно рассказывали стихотворения, водили хоровод.\nВместе с новогодними героями дети приняли участие в бумажном шоу.\nТакже участвовали в фотосессии.\nНикто не остался без подарка и праздничного настроения!\nВ свободное время смотрели новогодние мультфильмы, рисовали и играли.", "id": "other-2025-12-23-0"}, {"id": "other-2025-12-30-0", "iso": "2025-12-30", "date": "30 декабря 2025", "text": "🎄Сегодня у нас был весёлый  праздник. Было много песен, танцев и конкурсов. Вместе с новогодними героями ребята приняли участие в бумажном шоу. Никто не остался без подарка и праздничного настроения!\n❤️Дорогие родители, от всей души поздравляю вас с наступающими праздниками!\nДо встречи в следующем году!", "isNew": true}, {"date": "30 января 2026", "iso": "2026-01-30", "text": "🇷🇸Неделя сербской культуры:\n🔹 познакомились с выдающимися личностями Сербии, с основными фактами их биографии;\n🔹 приняли участие в демонстрации костюмов, изображали известных людей Сербии.", "id": "other-2026-01-30-0"}, {"date": "19 февраля 2026", "iso": "2026-02-19", "text": "🚢 «Борис Житков - мальчик, который исполнил свою мечту»:\n🔹 познакомились с новым художественным произведением, рассказом «Как я ловил человечков»;\n🔹 учились воспринимать чтение рассказа на слух.\nотвечать на вопросы сложными предложениями:\n🔹 учились различать жанры художественной литературы;\n🔹 развивали устную речь, внимание, память, мышление;\n🔹 воспитывали интерес к литературе;\n🔹 снимали физическое и умственное напряжения при помощи физкультурных упражнений.", "id": "other-2026-02-19-0"}, {"date": "2 марта 2026", "iso": "2026-03-02", "text": "Сегодня в школе прошёл замечательный праздник — День рождения школы 🎉\nРебята участвовали в конкурсах, танцевали, много смеялись и с радостью принимали участие во всех развлечениях. Праздник получился ярким, весёлым и очень дружным.\nПосле активной программы мы отправились на прогулку, а затем устроили сладкий стол с праздничным тортом 🍰\nДети получили массу положительных эмоций и отличное настроение!\nОт всей души благодарим родителей, которые разделили этот праздник вместе с нами.\nСпасибо за вашу поддержку, участие и тёплую атмосферу — благодаря вам этот день стал особенным!❤️", "id": "other-2026-03-02-0"}, {"id": "other-2026-05-25-0", "iso": "2026-05-25", "date": "25 мая 2026", "text": "❤️ Дорогие родители, сегодня у нас был последний рабочий день в рамках учебной программы. Спасибо вам за сотрудничество и поддержку!\nЗавтра ребята будут находиться под опекой педагогов нашей школы.\nДо свидания!", "isNew": true}], "Окружающий мир (2024-2025)": [{"id": "world24-2024-09-02-0", "iso": "2024-09-02", "date": "2 сентября 2024", "text": "Знакомство и формы приветствия:\n🔹 вспомнили ритуал знакомства, используя речевые обороты \"рад знакомству\", \"приятно познакомиться\";\n🔹 узнали как приветствуют друг друга люди других стран.", "edited": true}, {"id": "world24-2024-09-05-0", "iso": "2024-09-05", "date": "5 сентября 2024", "text": "Правила безопасного поведения на улице:\n🔹 обсудили правила поведения на улице, используя разноцветные сигналы Да/Нет;\n🔹 вспомнили основные правила дорожного движения;\n🔹 отрабатывали навыки сотрудничества и взаимопонимания."}, {"id": "world24-2024-09-09-0", "iso": "2024-09-09", "date": "9 сентября 2024", "text": "Смена времён года:\n🔹 узнали о зависимости смены времён года от вращения Земли вокруг Солнца;\n🔹 закрепили представление о временах года и их характерных признаках;\n🔹 вспомнили времена года и их характерные признаки;\n🔹 запомнили времена года в правильной последовательности (игра \"По порядку становись!\").", "e
