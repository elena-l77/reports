dited": true}, {"id": "world24-2024-09-09-1", "iso": "2024-09-10", "date": "10 сентября 2024", "text": "Осень:\n🔹 повторили осенние месяцы;\n🔹 обсудили признаки осени: как меняется природа и погода? Что делают животные? Что делают люди?\n🔹 посмотрели познавательный мультфильм «Кубокот. Времена года»;\n🔹 выполнили задание на внимательность: помогли белочке посчитать запасы.", "edited": true}, {"id": "world24-2024-09-16-0", "iso": "2024-09-16", "date": "16 сентября 2024", "text": "Осень:\n🔹 закрепляли представления детей о характерных признаках осени и осенних явлениях;\n🔹 учились называть приметы осени, изменения в природе."}, {"id": "world24-2024-09-19-0", "iso": "2024-09-19", "date": "19 сентября 2024", "text": "Жизнь животных осенью:\n🔹 узнали об особенностях поведения диких животных осенью;\n🔹 учились объяснять причины осенних изменений в жизни животных."}, {"id": "world24-2024-09-24-0", "iso": "2024-09-24", "date": "24 сентября 2024", "text": "Дары осени. Овощи:\n🔹 расширяли представления об осенних изменениях в природе;\n🔹 закрепляли знания об овощах;\n🔹 угадывали по запаху с закрытыми глазами овощи, отвечали на вопросы педагога."}, {"id": "world24-2024-09-26-0", "iso": "2024-09-26", "date": "26 сентября 2024", "text": "Дары осени. Овощи:\n🔹 закрепляли знания о пользе овощей и способах их применения;\n🔹 учились различать овощи по форме, цвету, вкусу;\n🔹 учились обобщать по существенным признакам (4-ый лишний)."}, {"id": "world24-2024-10-01-0", "iso": "2024-10-01", "date": "1 октября 2024", "text": "Дары осени. Фрукты:\n🔹 закрепляли знания о фруктах;\n🔹 расширяли представления об осенних изменениях в природе;\n🔹 угадывали фрукты по вкусу с закрытыми глазами, отвечали на вопросы педагога."}, {"id": "world24-2024-10-03-0", "iso": "2024-10-03", "date": "3 октября 2024", "text": "Дары осени. Фрукты:\n🔹 закрепляли знания о пользе фруктов и способах их применения;\n🔹 отвечали на вопросы педагога по теме."}, {"id": "world24-2024-10-08-0", "iso": "2024-10-08", "date": "8 октября 2024", "text": "Дары осени. Грибы:\n🔹 закрепляли знания о грибах;\n🔹 учились различать съедобные грибы от несъедобных;\n🔹 познакомились с правилами поведения в природе при сборе грибов."}, {"id": "world24-2024-10-15-0", "iso": "2024-10-15", "date": "15 октября 2024", "text": "Живая и неживая природа:\n🔹 познакомились с объектами живой и неживой природы, их признаками и связью между собой;\n🔹 упражнялись в различении понятий \"природа\" и \"не природа\", живая\" и \"неживая\" природа."}, {"id": "world24-2024-10-17-0", "iso": "2024-10-17", "date": "17 октября 2024", "text": "Животные леса:\n🔹 познакомились с дикими  животными лесов;\n🔹 учились различать детёнышей диких животных;\n🔹 учились бережному отношению к обитателям живой природы."}, {"id": "world24-2024-10-22-0", "iso": "2024-10-22", "date": "22 октября 2024", "text": "Животные леса:\n🔹 продолжили знакомиться с животными леса;\n🔹 уточнили представления о внешнем виде диких животных, о звуках, которые они издают."}, {"id": "world24-2024-10-24-0", "iso": "2024-10-24", "date": "24 октября 2024", "text": "Животные леса. Медведь. Волк:\n🔹 познакомились с особенностями жизни, питания, повадками медведя и волка, их средой обитания;\n🔹 формировали бережное отношение к природе."}, {"id": "world24-2024-10-29-0", "iso": "2024-10-29", "date": "29 октября 2024", "text": "Животные леса. Ёж. Белка:\n🔹 познакомились с особенностями жизни, питания, повадками ежа и белки, их средой обитания;\n🔹 формировали бережное отношение к природе."}, {"id": "world24-2024-11-05-0", "iso": "2024-11-05", "date": "5 ноября 2024", "text": "Животные леса. Кабан. Лиса:\n🔹 познакомились с особенностями жизни, питания, повадками кабана и лисы, их средой обитания;\n🔹 формировали бережное отношение к природе."}, {"id": "world24-2024-11-07-0", "iso": "2024-11-07", "date": "7 ноября 2024", "text": "Животные леса. Енот. Барсук. Хорёк:\n🔹 познакомились с особенностями жизни, питания, повадками животных, их средой обитания."}, {"id": "world24-2024-11-12-0", "iso": "2024-11-12", "date": "12 ноября 2024", "text": "Домашние животные:\n🔹 формировали представление о роли домашних животных в жизни человека;\n🔹 уточняли представление о потребностях домашних животных в жилье и пище;\n🔹 познакомились с историями одомашнивания некоторых животных."}, {"id": "world24-2024-11-14-0", "iso": "2024-11-14", "date": "14 ноября 2024", "text": "Домашние животные:\n🔹 учились устанавливать признаки для обобщения (живут рядом с человеком, приносят пользу);\n🔹 обобщили представления о детёнышах домашних животных."}, {"id": "world24-2024-11-19-0", "iso": "2024-11-19", "date": "19 ноября 2024", "text": "Домашние животные. Кошка:\n🔹 расширяли представления о кошках, познакомились с их жизнью, питанием, потребностями;\n🔹 формировали представления об элементарных правилах ухода за кошками;\n🔹 воспитывали бережное отношение к животным."}, {"id": "world24-2024-11-21-0", "iso": "2024-11-21", "date": "21 ноября 2024", "text": "Домашние животные. Собака:\n🔹 уточнили и расширили представление о собаках, познакомились с их жизнью, питанием, поговорили о пользе, которую собаки приносят людям;\n🔹 воспитывали бережное отношение к животным."}, {"id": "world24-2024-11-26-0", "iso": "2024-11-26", "date": "26 ноября 2024", "text": "Животные северного полюса:\n🔹 рассматривали глобус, формировали представления о различных климатических зонах;\n🔹 познакомились с животными севера, с их образом жизни, особенностями внешнего вида."}, {"id": "world24-2024-11-28-0", "iso": "2024-11-28", "date": "28 ноября 2024", "text": "Животные северного полюса:\n🔹 расширили представление о животных, их внешних признаках, повадках, среде обитания, условиях  жизни, защите от врагов;\n🔹 формировали первоначальные представления о взаимодействии и взаимозависимости  в мире природы."}, {"id": "world24-2024-12-03-0", "iso": "2024-12-03", "date": "3 декабря 2024", "text": "Зима:\n🔹 закрепляли и обобщали знания о зимнем времени года;\n🔹 смстематизировали знания  о характерных признаках зимы;\n🔹 расширили знания о взаимосвязи живой, неживой природы и жизни человека в зимнее время года."}, {"id": "world24-2024-12-05-0", "iso": "2024-12-05", "date": "5 декабря 2024", "text": "Зима в лесу:\n🔹 расширяли представления о зимовке зверей, птиц, учились отыскивать причины изменений условий их обитания;\n🔹 учились устанавливать причинно-следственные связи."}, {"id": "world24-2024-12-10-0", "iso": "2024-12-10", "date": "10 декабря 2024", "text": "Зимние забавы:\n🔹 обобщали знания о зимних видах спорта, уточняли знания о зимних забавах;\n🔹 формировали потребность в разнообразной двигательной деятельности на воздухе в зимний период."}, {"id": "world24-2024-12-12-0", "iso": "2024-12-12", "date": "12 декабря 2024", "text": "Животные жарких стран:\n🔹 рассматривали глобус, продолжили формировать представления о различных климатических зонах;\n🔹 познакомились с животными жарких стран, с их образом жизни, особенностями внешнего вида."}, {"id": "world24-2024-12-17-0", "iso": "2024-12-17", "date": "17 декабря 2024", "text": "Животные жарких стран:\n🔹 продолжили знакомиться с животными жарких стран;\n🔹 уточнили названия животных и их детенышей, внешние признаки, их строение, чем питаются, характерные повадки."}, {"id": "world24-2024-12-19-0", "iso": "2024-12-19", "date": "19 декабря 2024", "text": "Белый медведь и носорог:\n🔹 продолжили уточнять и систематизировать представления о жизни животных;\n🔹 составили таблицу, в которой сравнили место обитания, питание, размер животных;\n🔹 учились обобщать, устанавливать причинно-следственные связи."}, {"id": "world24-2024-12-24-0", "iso": "2024-12-24", "date": "24 декабря 2024", "text": "\"Как к нам пришёл Новый год\":\n🔹 познакомились с историей празднования Нового года;\n🔹 расширяли кругозор.\nвоспитывали уважение и интерес к народным традициям."}, {"id": "world24-2024-12-26-0", "iso": "2024-12-26", "date": "26 декабря 2024", "text": "\"Деды морозы из разных стран\":\n🔹 расширяли представления о традициях празднования Нового года в разных странах;\n🔹 познакомились с обычаями и традициями встречи Нового года в разных странах мира и их национальными героями;\n🔹 воспитывали уважительное отношение к традициям празднования Нового года людей разных национальностей."}, {"id": "world24-2025-01-09-0", "iso": "2025-01-09", "date": "9 января 2025", "text": "Птицы:\n🔹 формировали представления о птицах, как птицы приспособлены к жизни в разное время года;\n🔹 уточняли названия и отмечали особенности часто встречающихся птиц."}, {"id": "world24-2025-01-14-0", "iso": "2025-01-14", "date": "14 января 2025", "text": "Птицы. Домашние и дикие:\n🔹 учились различать домашних и диких птиц, опираясь на  характерные отличительные особенности; 🔹закрепили понимание, что домашние птицы живут рядом с человеком, а дикие живут на воле."}, {"id": "world24-2025-01-16-0", "iso": "2025-01-16", "date": "16 января 2025", "text": "Домашние птицы:\n🔹 систематизировали знания о домашних птицах, местах их обитания, голосе, питании, членах птичьих семей, пользе для человека."}, {"id": "world24-2025-01-21-0", "iso": "2025-01-21", "date": "21 января 2025", "text": "Опыт: \"Почему водоплавающие птицы не намокают в воде?\":\n🔹 расширили представления о водоплавающих птицах через практическое самостоятельное познание;\n🔹 развивали умение наблюдать, анализировать, делать выводы."}, {"id": "world24-2025-01-23-0", "iso": "2025-01-23", "date": "23 января 2025", "text": "Перелётные и зимующие птицы:\n🔹 формировали представление о зимующих и перелётных птицах, объясняли их различие;\n🔹 углубляли представления о причинах отлёта птиц (исчезновение корма, замерзание водоёмов, земли).", "isNew": true}, {"id": "world24-2025-01-28-0", "iso": "2025-01-28", "date": "28 января 2025", "text": "Обитатели морей и океанов:\n🔹 познакомились со средой обитания животных морей и океанов;\n🔹 рассмотрели глобус, познакомились с названиями всех океанов, их особенностями."}, {"id": "world24-2025-01-30-0", "iso": "2025-01-30", "date": "30 января 2025", "text": "Обитатели морей и океанов:\n🔹 продолжили знакомиться с морскими  животными, (акула,  черепаха, краб, медуза, осьминог, морской конек), их внешним видом, особенностями передвижения, приспособленностью к жизни в водной среде, особенностями  питания, поведения;\n🔹 познакомились с некоторыми формами защиты морских обитателей."}, {"id": "world24-2025-02-04-0", "iso": "2025-02-04", "date": "4 февраля 2025", "text": "Экспериментирование на тему\n«Вода. Соленая и пресная»:\n🔹 расширили представление о свойствах воды;\n🔹 провели эксперимент, в ходе которого поняли, что солёная вода тяжелее пресной."}, {"id": "world24-2025-02-06-0", "iso": "2025-02-06", "date": "6 февраля 2025", "text": "Дельфины и киты:\n🔹 расширили представление о морских обитателях, их образе жизни, среде обитания;\n🔹 учились бережному отношению к окружающей среде."}, {"id": "world24-2025-02-11-0", "iso": "2025-02-11", "date": "11 февраля 2025", "text": "Экспериментирование на тему \"Есть ли воздух в воде\":\n🔹 развивали познавательную активность, расширяли представления о воздухе и воде;\n🔹 провели эксперимент, в ходе которого поняли, что в воде есть воздух."}, {"id": "world24-2025-02-13-0", "iso": "2025-02-13", "date": "13 февраля 2025", "text": "Рыбы:\n🔹 уточняли и расширяли представления о рыбах, их разнообразии и образе жизни, строении и размножении."}, {"id": "world24-2025-02-18-0", "iso": "2025-02-18", "date": "18 февраля 2025", "text": "Аквариумные рыбы:\n🔹 формировали представление об аквариумных рыбах, их разнообразии, об аквариуме и предметах, необходимых для ухода за ним."}, {"id": "world24-2025-02-20-0", "iso": "2025-02-20", "date": "20 февраля 2025", "text": "Обобщение. Рыбы. Птицы. Звери:\n🔹 расширяли и углубляли знания о группах животных;\n🔹 развивали умение сравнивать, анализировать, делать выводы."}, {"id": "world24-2025-02-25-0", "iso": "2025-02-25", "date": "25 февраля 2025", "text": "Насекомые:\n🔹 расширяли знания о насекомых;\n🔹 закрепляли названия насекомых, внешние признаки, их строение."}, {"id": "world24-2025-02-27-0", "iso": "2025-02-27", "date": "27 февраля 2025", "text": "Насекомые. Бабочки:\n🔹 формировали умение  называть характерные особенности внешнего вида бабочки;\n🔹 закрепляли знания о развитии насекомого.\n🏆  На уроке ОФП  праздновали Масленицу, много танцевали, соревновались, отгадывали загадки."}, {"id": "world24-2025-03-04-0", "iso": "2025-03-04", "date": "4 марта 2025", "text": "Насекомые. Пчёлы:\n🔹 формировали  представления о пчёлах, о пользе этих насекомых, особенностях строения, жизни."}, {"id": "world24-2025-03-06-0", "iso": "2025-03-06", "date": "6 марта 2025", "text": "Насекомые. Муравьи:\n🔹 расширяли и закрепляли знания о муравьях, особенностях внешнего вида, образе жизни, распределении обязанностей в муравьиной семье."}, {"id": "world24-2025-03-11-0", "iso": "2025-03-11", "date": "11 марта 2025", "text": "Пресмыкающиеся:\n🔹 познакомились с пресмыкающимися животными;\n🔹 формировали  представления о внешнем виде и особенностях жизни пресмыкающихся."}, {"id": "world24-2025-03-13-0", "iso": "2025-03-13", "date": "13 марта 2025", "text": "Крокодилы:\n🔹 углубляли знания о пресмыкающихся;\n🔹 расширили знания о крокодиле, о его внешнем виде, повадках, среде обитания."}, {"id": "world24-2025-03-18-0", "iso": "2025-03-18", "date": "18 марта 2025", "text": "Черепахи:\n🔹 углубляли знания о пресмыкающихся;\n🔹 расширяли знания о черепахах, внешнем виде, повадках, среде обитания."}, {"id": "world24-2025-03-20-0", "iso": "2025-03-20", "date": "20 марта 2025", "text": "Ящерицы:\n🔹 углубляли знания о пресмыкающихся;\n🔹 расширяли знания о ящерицах, внешнем виде, повадках, среде обитания."}, {"id": "world24-2025-03-25-0", "iso": "2025-03-25", "date": "25 марта 2025", "text": "Паукообразные:\n🔹 познакомились с многообразием и образом жизни паукообразных, особенностями строения и жизнедеятельности."}, {"id": "world24-2025-03-27-0", "iso": "2025-03-27", "date": "27 марта 2025", "text": "Мир растений:\n🔹 формироввли  представление о многообразии растительного мира планеты;\n🔹 воспитывали ответственное отношение к растительному миру."}, {"id": "world24-2025-04-08-0", "iso": "2025-04-08", "date": "8 апреля 2025", "text": "Космос:\n🔹 уточнили и обобщили знания о космосе и солнечной системе;\n🔹 познакомились с  разнообразием видов звезд и созвездий."}, {"id": "world24-2025-04-10-0", "iso": "2025-04-10", "date": "10 апреля 2025", "text": "Первый космонавт:\n🔹 познакомились с историей освоения космоса, формировали представление о первом космонавте - Ю.А. Гагарине;\n🔹 развивали кругозор, интерес к истории космонавтики."}, {"id": "world24-2025-04-15-0", "iso": "2025-04-15", "date": "15 апреля 2025", "text": "Деревья и лес:\n🔹 уточняли и закрепляли знания о лесе и деревьях;\n🔹 формировали понятие о пользе деревьев, познакомились с правилами поведения в лесу."}, {"id": "world24-2025-04-17-0", "iso": "2025-04-17", "date": "17 апреля 2025", "text": "Дикие кустарники:\n🔹 познакомились с дикорастущими кустарниками;\n🔹 закрепляли знания о строении деревьев и кустарников: ствол, ветви, листья."}, {"id": "world24-2025-04-22-0", "iso": "2025-04-22", "date": "22 апреля 2025", "text": "Цветы:\n🔹 закрепляли знания о многообразии цветов, их строение;\n🔹 продолжили знакомиться с правилами ухода за цветами."}, {"id": "world24-2025-04-24-0", "iso": "2025-04-24", "date": "24 апреля 2025", "text": "Грибы:\n🔹 закрепляли и расширяли знания о грибах (название, место произрастания, строение);\n🔹 формировали  представление о съедобных и несъедобных грибах."}, {"id": "world24-2025-04-29-0", "iso": "2025-04-29", "date": "29 апреля 2025", "text": "Удивительные растения:\n🔹 познакомились с удивительными растениями и фактами о них;\n🔹 расширяли кругозор и воспитывали любознательность."}, {"id": "world24-2025-05-06-0", "iso": "2025-05-06", "date": "6 мая 2025", "text": "Предметный мир. Музыкальные инструменты:\n🔹 формировали представления о  музыкальных инструментах, слушали их звучание;\n🔹 учились классифицировать инструменты."}, {"id": "world24-2025-05-13-0", "iso": "2025-05-13", "date": "13 мая 2025", "text": "Предметный мир. Жилище человека:\n🔹 познакомились с видами жилищ человека (иглу, вигвам, юрта и т.д.), материалами из которых они изготовлены."}, {"id": "world24-2025-05-15-0", "iso": "2025-05-15", "date": "15 мая 2025", "text": "Предметный мир. Мебель:\n🔹 расширили представления о мебели и её назначении, об основных видах мебели."}, {"id": "world24-2025-05-22-0", "iso": "2025-05-22", "date": "22 мая 2025", "text": "Предметный мир. Предметы из прошлого:\n🔹 рассмотрели изображения различных предметов прошлого, пытались понять их назначение, вспоминали названия."}, {"id": "world24-2025-05-27-0", "iso": "2025-05-27", "date": "27 мая 2025", "text": "Предметный мир. Посуда:\n🔹 формировали обобщающее понятие «посуда»;\n🔹 уточнили название посуды;\n🔹 учились называть и различать кухонную, столовую и чайную посуду.\n✅ Диагностика готовности к школе:\n🔹 продолжили индивидуально выявлять и фиксировать уровень готовности к школе."}, {"id": "world24-2025-05-29-0", "iso": "2025-05-29", "date": "29 мая 2025", "text": "Предметный мир:\n🔹 знакомились со свойствами и отличительными признаками предметного мира;\n🔹 учились группировать предметы, называть одним словом."}], "Творчество (2024/2025)": [{"id": "art24-2024-09-02-0", "iso": "2024-09-02", "date": "2 сентября 2024", "text": "Цвет – свойство предметов:\n🔹 знакомство детей с таблицей цветов;\n🔹 понятие об основных и составных цветах;\n🔹 закрепление цветов и оттенков в рисунке \"Радуга\";\n🔹 узнали опытным путём, как можно получить оттенки цветов.", "edited": true}, {"id": "art24-2024-09-03-0", "iso": "2024-09-03", "date": "3 сентября 2024", "text": "Рисунок \"Моя любимая игрушка\":\n🔹 учились передавать образ предмета в творчестве;\n🔹 развивали фантазию и мелкую моторику;\n🔹 проявляли интерес к творческому самовыражению.", "edited": true}, {"id": "art24-2024-09-09-0", "iso": "2024-09-09", "date": "9 сентября 2024", "text": "Пластилинография \"Солнышко\":\n🔹 учились работать с пластилином, узнали его свойства;\n🔹 упражнялись в использовании технических навыков при работе с пластилином (примазывание, расплющивание)."}, {"id": "art24-2024-09-12-0", "iso": "2024-09-12", "date": "12 сентября 2024", "text": "\"Улетает наше лето\":\n🔹 учились выражать летние впечатления на рисунке;\n🔹 проявляли самостоятельность и оригинальность."}, {"id": "art24-2024-09-16-0", "iso": "2024-09-16", "date": "16 сентября 2024", "text": "Коллективная работа в технике ниткография \"Волшебный лес\":\n🔹 совместно, используя технику ниткография, нарисовали картину;\n🔹 расширяли представления о красоте природы;\n🔹 учились коллективной творческой деятельности."}, {"id": "art24-2024-09-17-0", "iso": "2024-09-17", "date": "17 сентября 2024", "text": "Раскрашивание контурных картинок \"Моя осень\":\n🔹 раскрашивали мнемотаблицу \"Времена года \", придавая ей индивидуальность;\n🔹 учились соотносить цвет и время года."}, {"id": "art24-2024-09-20-0", "iso": "2024-09-20", "date": "20 сентября 2024", "text": "\"Выразительный и ловкий карандаш\". Рисунок \"На пороге школы\":\n🔹 учились использовать выразительные возможности карандаша;\n🔹 учились регулировать силу нажима на карандаш;\n🔹 учились позитивно смотреть в будущее, представляя себя первоклассниками."}, {"id": "art24-2024-09-23-0", "iso": "2024-09-23", "date": "23 сентября 2024", "text": "Конструирование из бумаги в технике оригами - гирлянда \"Осенний листопад\":\n🔹 выполнили первый этап коллективной работы (конструирование листьев);\n🔹 учились складывать попалам, складывать гармошкой;\n🔹 совершенствовали навык работы с клеем."}, {"id": "art24-2024-09-25-0", "iso": "2024-09-25", "date": "25 сентября 2024", "text": "Конструирование гирлянды \"Осенний листопад\":\n🔹 учились комбинировать листья по цвету;\n🔹 учились крепить листья к бечёвке, завязывать узлы."}, {"id": "art24-2024-09-27-0", "iso": "2024-09-27", "date": "27 сентября 2024", "text": "Раскрашивание контурных картинок:\n🔹 раскрашивали мнемотаблицу \"Овощи\", придавая ей индивидуальность;\n🔹 запоминали через раскрашивание план описательного рассказа."}, {"id": "art24-2024-09-30-0", "iso": "2024-09-30", "date": "30 сентября 2024", "text": "Изготовление поздравительной открытки. Комбинированная работа из бумаги. 1-ый этап:\n🔹 учились сгибать лист бумаги по линиям сгиба;\n🔹 развивали умение поэтапного выполнения работы, умение планировать, видеть результат."}, {"id": "art24-2024-10-02-0", "iso": "2024-10-02", "date": "2 октября 2024", "text": "Изготовление поздравительной открытки. 2-ой этап:\n🔹 закрепляли умение создавать композицию;\n🔹 учились складывать лист бумаги \"гармошкой\"."}, {"id": "art24-2024-10-04-0", "iso": "2024-10-04", "date": "4 октября 2024", "text": "Изготовление поздравительной открытки:\n🔹 упражнялись в составлении изображения предметов, передавая форму и детали (цветок, его середина, сердечко);\n🔹 отрабатывали навык работы с клеем;\n🔹 поздравили коллектив нашей школы с Днём Учителя и подарили наши открытки."}, {"id": "art24-2024-10-07-0", "iso": "2024-10-07", "date": "7 октября 2024", "text": "\"Ветка рябины\". 1-ый этап:\n🔹 учились передавать характерные особенности натуры (форму частей, строение ветки и листа, их цвет);\n🔹 закрепляли разные приёмы  рисования кистью (всем ворсом и концом)."}, {"id": "art24-2024-10-09-0", "iso": "2024-10-09", "date": "9 октября 2024", "text": "\"Ветка рябины\". 2-ой этап:\n🔹 упражнялись в рисовании акварелью;\n🔹 учились сопоставлять работу с натурой, добиваться точности в изображении."}, {"id": "art24-2024-10-11-0", "iso": "2024-10-11", "date": "11 октября 2024", "text": "\"Чудесная мозаика\":\n🔹 познакомились с декоративной оформительской техникой - мозаикой для создания многоцветной композиции;\n🔹 учились регулировать силу нажима на карандаш, закрашивать контурные рисунки."}, {"id": "art24-2024-10-14-0", "iso": "2024-10-14", "date": "14 октября 2024", "text": "Поделка из природного материала \"Ёжик\" 1-ый этап:\n🔹 познакомились с художественным видом конструирования из природного материала;\n🔹 рассматривали шишки, искали ассоциациативные образы лесных персонажей;\n🔹 учились работать с пластилином и хрупким природным материалом."}, {"id": "art24-2024-10-16-0", "iso": "2024-10-16", "date": "16 октября 2024", "text": "Поделка из природного материала \"Ёжик\":\n🔹 изготовили поделку, дополнив её деталями (глазки, носик, яблочко, листик);\n🔹 используя маленькие кусочки пластилина, развивали мелкую моторику пальцев рук."}, {"id": "art24-2024-10-18-0", "iso": "2024-10-18", "date": "18 октября 2024", "text": "Чудесная мозаика \"Котёнок\":\n🔹 продолжили знакомиться с декоративной оформительской техникой - мозаикой;\n🔹 создавали многоцветные композиции;\n🔹 учились располагать цвета мозаики, проявляя индивидуальный художественный вкус."}, {"id": "art24-2024-10-21-0", "iso": "2024-10-21", "date": "21 октября 2024", "text": "Поделка из бумаги на Хэллоуин 1-ый этап:\n🔹 закрепляли умение работать с бумагой и ножницами (паутина);\n🔹 расширяли представления о международном празднике \"Хэллоуин\"."}, {"id": "art24-2024-10-23-0", "iso": "2024-10-23", "date": "23 октября 2024", "text": "Поделка из бумаги на Хэллоуин 2-ой этап:\n🔹 продолжили работу с бумагой, вырезали тело, голову, готовили другие части паука;\n🔹 вспомнили правила работы с ножницами."}, {"id": "art24-2024-10-25-0", "iso": "2024-10-25", "date": "25 октября 2024", "text": "Поделка из бумаги на Хэллоуин:\n🔹 тренировались складывать тонкую полоску бумаги  \"гармошкой\"(лапки паука);\n🔹 соединили все части паука, отрабатывали навык работы с клеем."}, {"id": "art24-2024-10-28-0", "iso": "2024-10-28", "date": "28 октября 2024", "text": "\"Дорисуй картинку\":\n🔹 учились по половинке рисунка распознавать и дорисовывать образ, объединять несколько предметов одним сложным;\n🔹 отрабатывали навык работы простым карандашом."}, {"id": "art24-2024-10-30-0", "iso": "2024-10-30", "date": "30 октября 2024", "text": "\"Дорисуй картинку\":\n🔹 продолжили составлять целое изображение из двух частей;\n🔹 продолжили развивать умение группировать предметы по признакам (цвет, форма, размер).", "edited": true}, {"id": "art24-2024-11-01-0", "iso": "2024-11-01", "date": "1 ноября 2024", "text": "\"Дорисуй картинку\":\n🔹 продолжили составлять целое изображение из двух частей, раскрашивали полученные картинки;\n🔹 развивали творческое воображение, учились понимать замысел целого по половине картинки."}, {"id": "art24-2024-11-04-0", "iso": "2024-11-04", "date": "4 ноября 2024", "text": "\"Придумай, чем может стать красивый осенний листок\":\n🔹 развивали творческое воображение;\n🔹 упражнялись в аккуратном закрашивании;\n🔹 учились обрисовывать сложную форму листа."}, {"id": "art24-2024-11-06-0", "iso": "2024-11-06", "date": "6 ноября 2024", "text": "\"Придумай, чем может стать красивый осенний листок\". Черепаха:\n🔹 продолжили развивать ассоциациативные связи (листок-черепаха);\n🔹 упражнялись в аккуратном закрашивании, отрабатывали силу нажима на карандаш."}, {"id": "art24-2024-11-08-0", "iso": "2024-11-08", "date": "8 ноября 2024", "text": "\"Придумай, чем может стать красивый осенний листок\".\nБабочка:\n🔹 учились обрисовывать сложную форму листа, передавать форму и окраску;\n🔹 совершенствовали изобразительную технику (смешивание штриховки для получения оттенков)."}, {"id": "art24-2024-11-11-0", "iso": "2024-11-11", "date": "11 ноября 2024", "text": "Аппликация \"Осеннее дерево\" 1-ый этап:\n🔹 продумали этапы работы, сформировали красивый образ осеннего дерева;\n🔹 провели подготовительную работу, обвели по контуру и раскрасили ствол дерева."}, {"id": "art24-2024-11-13-0", "iso": "2024-11-13", "date": "13 ноября 2024", "text": "Аппликация \"Осеннее дерево\" 2-ой этап:\n🔹 развивали практические умения в работе с бумагой и ножницами, вырезали ствол дерева по контуру;\n🔹 развивали усидчивость и аккуратность."}, {"id": "art24-2024-11-15-0", "iso": "2024-11-15", "date": "15 ноября 2024", "text": "Апликация \"Осеннее дерево\":\n🔹 создали образ осеннего дерева в аппликации;\n🔹 учились располагать элементы на листе бумаги, создавая композицию, работать с клеем;\n🔹 развивали творческое воображение, чувство цвета, мелкую моторику."}, {"id": "art24-2024-11-18-0", "iso": "2024-11-18", "date": "18 ноября 2024", "text": "Городецкая роспись. 1-ый этап:\n🔹 познакомились с историей возникновения Городецкого промысла;\n🔹 рассмотрели иллюстрации изделий, учились любоваться предметами народного творчества;\n🔹 прослушали стихотворение \"Город-сказка-Городец\"."}, {"id": "art24-2024-11-20-0", "iso": "2024-11-20", "date": "20 ноября 2024", "text": "Городецкая роспись. 2-ой этап:\n🔹 продолжили знакомиться с историей Городецкого промысла;\n🔹 учились узнавать и называть основные элементы росписи (ромашка, купавка, розан, листочки, городецкая роза)."}, {"id": "art24-2024-11-22-0", "iso": "2024-11-22", "date": "22 ноября 2024", "text": "Городецкая роспись:\n🔹 обучались приёмам работы в технике Городецкой росписи;\n🔹 закрепляли технические приёмы рисования гуашью, смешивания красок на палитре;\n🔹 учились получать положительные впечатления от создания своей работы."}, {"id": "art24-2024-11-25-0", "iso": "2024-11-25", "date": "25 ноября 2024", "text": "Портрет:\n🔹 расширяли представление о портрете как жанре изобразительного искусства;\n🔹 познакомились с известными картинами-портретами, рассмотрели их репродукции."}, {"id": "art24-2024-11-27-0", "iso": "2024-11-27", "date": "27 ноября 2024", "text": "\"Портрет мамы\":\n🔹 продолжили знакомиться с жанром изобразительного искусства-портретом;\n🔹 развивали умение передавать характерные особенности лица (цвет глаз, волос), соблюдать пропорции."}, {"id": "art24-2024-11-29-0", "iso": "2024-11-29", "date": "29 ноября 2024", "text": "\"Портрет мамы\":\n🔹 рисовали, дополняя  набросок портрета индивидуальными особенностями;\n🔹 учились соблюдать последовательность при рисовании;\n🔹 закрепляли умение закрашивать, не выходя за контур;\n🔹 учились передавать свои чувства к близким людям в изображении."}, {"id": "art24-2024-12-02-0", "iso": "2024-12-02", "date": "2 декабря 2024", "text": "Коллаж \"Полезные и вредные продукты\". 1-ый этап:\n🔹 познакомились с понятием \"коллаж\" как с особой техникой изобразительного искусства;\n🔹 формировали представления о пользе и вреде еды для организма."}, {"id": "art24-2024-12-04-0", "iso": "2024-12-04", "date": "4 декабря 2024", "text": "Коллаж \"Полезные и вредные продукты\". 2-ой этап:\n🔹 закрепляли умение работать с ножницами;\n🔹 упражнялись в вырезании изображений мелких предметов из бумаги."}, {"id": "art24-2024-12-06-0", "iso": "2024-12-06", "date": "6 декабря 2024", "text": "Коллаж \"Полезные и вредные продукты\":\n🔹 развивали умение подбирать элементы для коллажа по размеру;\n🔹 отрабатывали навык работы с клеем;\n🔹 развивали чувство цвета и композиции."}, {"id": "art24-2024-12-09-0", "iso": "2024-12-09", "date": "9 декабря 2024", "text": "Новогодняя гирлянда. 1-ый этап. \"Снежный ангел\":\n🔹 познакомились с новым материалом для творчества - фетром;\n🔹 отрабатывали навык работы с шаблоном, рисовали ангела, обводили по контуру."}, {"id": "art24-2024-12-11-0", "iso": "2024-12-11", "date": "11 декабря 2024", "text": "Новогодняя гирлянда. 2-ой этап. \"Снежные цветы\":\n🔹 познакомились с новым материалом для творчества - гофрированной бумагой;\n🔹 учились складывать гофрированную бумагу гармошкой, закреплять элементы, аккуратно расправлять лепестки."}, {"id": "art24-2024-12-13-0", "iso": "2024-12-13", "date": "13 декабря 2024", "text": "Новогодняя гирлянда. 3-ий этап. Объёмные снежинки:\n🔹 учились складывать квадратную заготовку в несколько раз;\n🔹 продолжили совершенствовать навык  вырезания мелких деталей с  углами, отрабатывали навык работы с клеем."}, {"id": "art24-2024-12-16-0", "iso": "2024-12-16", "date": "16 декабря 2024", "text": "Новогодняя гирлянда:\n🔹 украсили объёмные снежинки стразами;\n🔹 соединили все детали в гирлянды."}, {"id": "art24-2024-12-18-0", "iso": "2024-12-18", "date": "18 декабря 2024", "text": "Составление подвесок:\n🔹 познакомились с новым способом соединения с помощью термопистолета;\n🔹 прикрепляли снежные цветы к лентам, используя термопистолет;\n🔹 развивали осторожность и аккуратность в работе."}, {"id": "art24-2024-12-19-0", "iso": "2024-12-19", "date": "19 декабря 2024", "text": "Ёлочные шары:\n🔹 развивали навык работы с акриловыми красками, учились смешивать краски, добиваться нужного оттенка;\n🔹 раскрашивали белые шары, превращая их в новогодние украшения."}, {"id": "art24-2024-12-23-0", "iso": "2024-12-23", "date": "23 декабря 2024", "text": "Изготовление ёлочной игрушки \"Новогодние носочки\" 1-ый этап:\n🔹 из бумаги изготовили шаблон;\n🔹 закрепляли приобретённый навык разметки по шаблону, тренировались обводить простым карандашом."}, {"id": "art24-2024-12-27-0", "iso": "2024-12-27", "date": "27 декабря 2024", "text": "Изготовление ёлочной игрушки \"Новогодние носочки\":\n🔹 закрепляли умение планировать свою работу;\n🔹 выполнили аппликацию из фетра с применением шва \"вперёд иголка\";\n🔹 развивали мелкую моторику пальцев и рук, работая швейной иголкой.", "edited": true}, {"id": "art24-2025-01-10-0", "iso": "2025-01-10", "date": "10 января 2025", "text": "Рисунок \"Мои новогодние каникулы\":\n🔹 познакомились с жанром изобразительного искусства - комикс;\n🔹 учились отражать в рисунке-комиксе впечатления, полученные во время каникул;\n🔹 учились делать предварительный набросок простым карандашом;\n🔹 закрепляли умение располагать изображение на листе бумаги."}, {"id": "art24-2025-01-13-0", "iso": "2025-01-13", "date": "13 января 2025", "text": "Рисунок \"Морозные узоры на окне\" 1-ый этап:\n🔹 вспомнили, что бывают морозные узоры, как они появляются на стёклах;\n🔹 нарисовали фон будущей работы;\n🔹 отрабатывали навык работы широкой кистью и гуашью."}, {"id": "art24-2025-01-15-0", "iso": "2025-01-15", "date": "15 января 2025", "text": "Рисунок \"Морозные узоры на окне\":\n🔹 рассмотрели иллюстрации морозных узоров;\n🔹 учились изображать морозные узоры при помощи графических элементов (линии, кружочки, точки, завитки);\n🔹 закрепляли приёмы рисования кистью."}, {"id": "art24-2025-01-20-0", "iso": "2025-01-20", "date": "20 января 2025", "text": "Поделки \"Сова\" из втулки путем аппликации и рисования 1-ый этап:\n🔹 уточнили представление о внешнем виде и образе жизни совы;\n🔹 раскрашивали втулку гуашью, тренировались складывать втулку, моделируя тело совы."}, {"id": "art24-2025-01-22-0", "iso": "2025-01-22", "date": "22 января 2025", "text": "Поделка \"Сова\" 2-ой этап:\n🔹 вырезали из бумаги кружки разного диаметра (перья, глаза совы), треугольники (клюв), овалы (крылья);\n🔹 отрабатывали навык работы с ножницами, развивали мелкую моторику."}, {"id": "art24-2025-01-29-0", "iso": "2025-01-29", "date": "29 января 2025", "text": "Рисунок \"Сказочный дворец\":\n🔹 закрепляли умение рисовать основу здания и придумывать украшающие детали;\n🔹 учились делать набросок простым карандашом."}, {"id": "art24-2025-01-31-0", "iso": "2025-01-31", "date": "31 января 2025", "text": "Рисунок \"Сказочный дворец\":\n🔹 учились оформлять изображение в цвете, доводить замысел до конца, добиваться наиболее интересного решения."}, {"id": "art24-2025-02-03-0", "iso": "2025-02-03", "date": "3 февраля 2025", "text": "Панно \"Город, в котором я живу\":\n🔹 расширяли и закрепляли представления о городе Нови-Сад;\n🔹 провели виртуальную экскурсию, рассмотрели фото достопримечательностей города."}, {"id": "art24-2025-02-05-0", "iso": "2025-02-05", "date": "5 февраля 2025", "text": "Панно \"Город, в котором я живу\" 2-ой этап:\n🔹 вырезали изображения городских достопримечательностей, тренировались вырезать мелкие предметы;\n🔹 приклеивали изображения на панно, создавая композицию."}, {"id": "art24-2025-02-07-0", "iso": "2025-02-07", "date": "7 февраля 2025", "text": "Панно \"Город, в котором я живу\":\n🔹 нарисовали дома, в которых живут дети, дополнили панно этими  рисунками;\n🔹 воспитывали уважительное отношение к городу, в котором живём."}, {"id": "art24-2025-02-10-0", "iso": "2025-02-10", "date": "10 февраля 2025", "text": "Лепка из пластилина \"Рыбка\":\n🔹 развивали мелкую моторику.\nвоспитывали усидчивость, терпение, внимательность:\n🔹 закрепляли ранее изученные приемы лепки (сплющивание.\nотщипывание от целого куска пластилина)."}, {"id": "art24-2025-02-12-0", "iso": "2025-02-12", "date": "12 февраля 2025", "text": "Поделка из термомазаики \"Сердце\":\n🔹 познакомились с техникой термомазаики, изучали особенности материала, правила работы в этой технике;\n🔹 приступили к моделированию \"сердца\", используя трафарет и схемы."}, {"id": "art24-2025-02-13-0", "iso": "2025-02-13", "date": "13 февраля 2025", "text": "Поделка из термомазаики \"Сердце\":\n🔹 с помощью утюга скрепили элементы мозаики;\n🔹 повторили правила безопасного поведения с горячими предметами."}, {"id": "art24-2025-02-17-0", "iso": "2025-02-17", "date": "17 февраля 2025", "text": "Конструирование в технике оригами \"Рыбки в аквариуме\" (коллективная композиция) 1-ый этап:\n🔹 познакомились с новой техникой складывания бумаги – оригами (на примере выполнения рыбки);\n🔹 рисовали аквариум и водоросли."}, {"id": "art24-2025-02-19-0", "iso": "2025-02-19", "date": "19 февраля 2025", "text": "Конструирование в технике оригами \"Рыбки\":\n🔹 продолжили формировать умение конструировать поделки из бумаги по инструкции и показу педагога;\n🔹 отрабатывали навыки сгибания квадратного листа бумаги по диагонали и пополам."}, {"id": "art24-2025-02-21-0", "iso": "2025-02-21", "date": "21 февраля 2025", "text": "Конструирование в технике оригами \"Рыбки в аквариуме\":\n🔹 добавляли детали в аквариум (песок, ракушка);\n🔹 приклеивали рыбок, создавая композицию."}, {"id": "art24-2025-02-24-0", "iso": "2025-02-24", "date": "24 февраля 2025", "text": "\"Матрёшка\" лепка в технике пластилинографии:\n🔹 развивали интерес и любовь к народной игрушке;\n🔹 подготовили шаблон матрёшки, вырезали по контуру, отрабатывали навык работы с ножницами."}, {"id": "art24-2025-02-26-0", "iso": "2025-02-26", "date": "26 февраля 2025", "text": "\"Матрёшка\" лепка в технике пластилинографии:\n🔹 узнали о происхождении матрешки, познакомились с различными видами русской матрешки;\n🔹 закрепляли умение использовать в работе ранее усвоенные приемы лепки (скатывание, сглаживание границ соединения)."}, {"id": "art24-2025-02-28-0", "iso": "2025-02-28", "date": "28 февраля 2025", "text": "\"Матрёшка\" лепка в технике пластилинографии:\n🔹 продолжили отрабатывать навык работы с пластилином;\n🔹 развивали мелкую моторику, усидчивость, аккуратность."}, {"id": "art24-2025-03-03-0", "iso": "2025-03-03", "date": "3 марта 2025", "text": "Открытка для мамы в технике квиллинг:\n🔹 познакомились с новой техникой работы с бумагой - квиллинг;\n🔹 обсудили этапы работы, элементы композиции."}, {"id": "art24-2025-03-05-0", "iso": "2025-03-05", "date": "5 марта 2025", "text": "Открытка для мамы в технике квиллинг:\n🔹 закрепляли умение скручивать спираль;\n🔹 учились из \"спирали\" формировать \"свободную спираль\", \"каплю\", \"глаз\"."}, {"id": "art24-2025-03-07-0", "iso": "2025-03-07", "date": "7 марта 2025", "text": "Открытка для мамы в технике квиллинг:\n🔹 аккуратно наклеивали готовые детали на заготовку открытки, создавая композицию;\n🔹 развивали творческую активность, желание завершать начатое дело.\n💐Дорогие мамы наших замечательных учеников, поздравляю вас с наступающи праздником! Пусть все мечты сбываются!"}, {"id": "art24-2025-03-10-0", "iso": "2025-03-10", "date": "10 марта 2025", "text": "Натюрморт:\n🔹 познакомились с понятием «натюрморт», работами художников-мастеров, выявили отличие натюрморта от простого изображения предметов."}, {"id": "art24-2025-03-12-0", "iso": "2025-03-12", "date": "12 марта 2025", "text": "Натюрморт:\n🔹 сделали набросок натюрморта простым карандашом, рисовали цветы, фрукты, декорировали вазу."}, {"id": "art24-2025-03-14-0", "iso": "2025-03-14", "date": "14 марта 2025", "text": "Натюрморт:\n🔹 раскрашивали натюрморт, закрепляли умение определять форму, цвет предметов;\n🔹 развивали интерес, умение восхищаться содержанием, красотой картин."}, {"id": "art24-2025-03-17-0", "iso": "2025-03-17", "date": "17 марта 2025", "text": "Коллективная аппликация «Разные виды транспорта»:\n🔹 обсудили этапы работы, распределили обязанности;\n🔹 приступили к изготовлению панорамы местности для дальнейшей аппликации."}, {"id": "art24-2025-03-19-0", "iso": "2025-03-19", "date": "19 марта 2025", "text": "Коллективная аппликация \"Разные виды транспорта\":\n🔹 продолжили оформлять панораму местности для аппликации;\n🔹 сделали набросок простым карандашом (небо, лес, железная дорога, река и т.д.)."}, {"id": "art24-2025-03-21-0", "iso": "2025-03-21", "date": "21 марта 2025", "text": "Коллективная аппликация \"Разные виды транспорта\":\n🔹 продолжили оформлять панораму местности;\n🔹 познакомились с нетрадиционной техникой рисования \"рисование губкой\"."}, {"id": "art24-2025-03-24-0", "iso": "2025-03-24", "date": "24 марта 2025", "text": "Коллективная аппликация \"Разные виды транспорта\":\n🔹 закрепляли умение вырезать детали из бумаги чётко по контуру;\n🔹 совершенствовали умение сгибать бумагу разной фомы пополам, вчетверо."}, {"id": "art24-2025-03-26-0", "iso": "2025-03-26", "date": "26 марта 2025", "text": "Коллективная аппликация \"Разные виды транспорта\":\n🔹 продолжили вырезать детали для аппликации;\n🔹 развивали мелкую моторику пальцев, воспитывали аккуратность и усидчивость."}, {"id": "art24-2025-03-28-0", "iso": "2025-03-28", "date": "28 марта 2025", "text": "Коллективная аппликация \"Разные виды транспорта\":\n🔹 создавали единую конструкцию из элементов;\n🔹 развивали глазомер, чёткость движений рук, отрабатывали навык работы с клеем."}, {"id": "art24-2025-04-07-0", "iso": "2025-04-07", "date": "7 апреля 2025", "text": "Поделка \"Космическая ракета\" из втулки путём рисования и аппликации 1-ый этап:\n🔹 обсудили этапы работы.\nраскрашивали втулку гуашью."}, {"id": "art24-2025-04-09-0", "iso": "2025-04-09", "date": "9 апреля 2025", "text": "Поделка \"Космическая ракета\" 2-ой этап:\n🔹 вырезали из бумаги детали для ракеты (кружки разного диаметра, треугольники);\n🔹 отрабатывали навык работы с ножницами."}, {"id": "art24-2025-04-11-0", "iso": "2025-04-11", "date": "11 апреля 2025", "text": "Поделка \"Космическая ракета\":\n🔹 продолжили учиться делать фигурки из втулки;\n🔹 учились создавать поделку из отдельных деталей, развивали творческое воображение и аккуратность."}, {"id": "art24-2025-04-14-0", "iso": "2025-04-14", "date": "14 апреля 2025", "text": "Рисунок \"Деревья смотрят в озеро\":\n🔹 познакомились с новой техникой рисования двойных (зеркально-симметричных) изображений акварельными красками;\n🔹 рассмотрели репродукции пейзажей известных художников (И.И. Левитан, М В. Нестеров) и детские рисунки, выполненные в этой технике."}, {"id": "art24-2025-04-16-0", "iso": "2025-04-16", "date": "16 апреля 2025", "text": "Рисунок \"Деревья смотрят в озеро\":\n🔹 познакомились с возможностями способа рисования \"по мокрому\" с получением отпечатков как выразительно-изобразительного средства в детской живописи;\n🔹 учились создавать гармоничную цветовую композицию."}, {"id": "art24-2025-04-21-0", "iso": "2025-04-21", "date": "21 апреля 2025", "text": "Ниткография \"Жук\":\n🔹 познакомились  с нетрадиционной техникой рисования – ниткографией;\n🔹 тренировали умение выкладывать жука из ниток, передавая особенности внешнего вида и пропорции."}, {"id": "art24-2025-04-23-0", "iso": "2025-04-23", "date": "23 апреля 2025", "text": "Ниткография \"Жук\":\n🔹 продолжили выкладывать из ниток тело жука, отрабатывали навык работы с клеем и ножницами."}, {"id": "art24-2025-04-25-0", "iso": "2025-04-25", "date": "25 апреля 2025", "text": "Ниткография \"Жук\":\n🔹 дополняли рисунок из ниток деталями (голова, лапки), составляли композицию;\n🔹 развивали зрительный контроль за движением палцев рук при работе с ножницами и нитками."}, {"id": "art24-2025-04-29-0", "iso": "2025-04-29", "date": "29 апреля 2025", "text": "Рисунок по мотивам русской народной сказки \"Колобок\":\n🔹 закрепляли умение работать карандашом, учились поэтапному рисованию."}, {"id": "art24-2025-04-30-0", "iso": "2025-04-30", "date": "30 апреля 2025", "text": "Рисунок по мотивам русской народной сказки \"Колобок\":\n🔹 учились выразительно передавать образ Колобка, работать цветными карандашами, тщательно прорабатывать детали рисунка."}, {"id": "art24-2025-05-05-0", "iso": "2025-05-05", "date": "5 мая 2025", "text": "Аппликация \"Ветка сирени\":\n🔹 обсудили этапы работы;\n🔹 учились вырезать из цветной бумаги круги разного диаметра;\n🔹 развивали мелкую моторику рук, усидчивость."}, {"id": "art24-2025-05-06-0", "iso": "2025-05-06", "date": "6 мая 2025", "text": "Аппликация \"Ветка сирени\":\n🔹 учились делать цветок из цветной бумаги приёмом складывания, учились создавать композицию."}, {"id": "art24-2025-05-08-0", "iso": "2025-05-08", "date": "8 мая 2025", "text": "Аппликация \"Ветка сирени\":\n🔹 приклеивали цветы на шаблон, чередуя большие и маленькие, выполнили объёмную композицию;\n🔹 формировали желание создавать красивое своими руками."}, {"id": "art24-2025-05-12-0", "iso": "2025-05-12", "date": "12 мая 2025", "text": "Рисунок \"Домик для скворцов\":\n🔹 обсудили этапы работы, рассмотрели фотографии скворечников, назвали его части;\n🔹 выполнили набросок работы простым карандашом."}, {"id": "art24-2025-05-14-0", "iso": "2025-05-14", "date": "14 мая 2025", "text": "Рисунок \"Домик для скворцов\":\n🔹 тонировали лист голубым, ствол и ветки раскрашивали белым цветом;\n🔹 закрепляли приёмы закрашивания, правила работы с красками и кистью."}, {"id": "art24-2025-05-16-0", "iso": "2025-05-16", "date": "16 мая 2025", "text": "Рисунок \"Домик для скворцов\":\n🔹 учились рисовать предмет прямоугольной формы, треугольную крышу и круглый леток, зелёные листья;\n🔹 учились правильно передавать величину частей предмета."}, {"id": "art24-2025-05-19-0", "iso": "2025-05-19", "date": "19 мая 2025", "text": "Коллективная аппликация \"Дерево дружбы\":\n🔹 обсудили этапы работы, познакомились с техникой аппликации из ладошек;\n🔹 сделали набросок простым карандашом, начали раскрашивать узоры."}, {"id": "art24-2025-05-21-0", "iso": "2025-05-21", "date": "21 мая 2025", "text": "Коллективная аппликация \"Дерево дружбы\":\n🔹 продолжили рисовать и раскрашивать узоры на ладошках;\n🔹 учились аккуратно вырезать мелкие детали."}, {"id": "art24-2025-05-26-0", "iso": "2025-05-26", "date": "26 мая 2025", "text": "Обрывная аппликация \"Мечты о море\":\n🔹 обсудили этапы работы, познакомились с техникой обрывной аппликации;\n🔹 учились аккуратно разрывать бумагу на кусочки небольшого размера."}, {"id": "art24-2025-05-28-0", "iso": "2025-05-28", "date": "28 мая 2025", "text": "Обрывная аппликация \"Мечты о море\":\n🔹 продолжили аккуратно разрывать бумагу;\n🔹 приступили к заполнению шаблона кусочками бумаги, учились аккуратно работать с клеем."}, {"id": "art24-2025-05-29-0", "iso": "2025-05-29", "date": "29 мая 2025", "text": "Обрывная аппликация \"Мечты о море\":\n🔹 продолжили заполнять шаблон кусочками бумаги;\n🔹 развивали мелкую моторику рук и творческое воображение.", "edited": true}]}</script>

  {key:'Творчество',       var:'art'},
  {key:'Окружающий мир (2024-2025)', var:'world24'},
  {key:'Творчество (2024/2025)',     var:'art24'},
  {key:'Другое',           var:'other'},
];

const root = getComputedStyle(document.documentElement);
function cssVar(name){ return root.getPropertyValue(name).trim(); }

const subjectsEl = document.getElementById('subjects');
const listEl = document.getElementById('list');
const panelTitle = document.getElementById('panelTitle');
const panelCount = document.getElementById('panelCount');
const panelDot = document.getElementById('panelDot');

let active = null;

function buildChips(){
  subjectsEl.innerHTML = ''; // guard against stale chips baked into a re-downloaded/re-saved file
  SUBJECT_META.forEach(meta=>{
    const items = DATA[meta.key] || [];
    if(items.length === 0) return;
    const dot = cssVar('--c-'+meta.var);
    const bg = cssVar('--c-'+meta.var+'-bg');
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.style.setProperty('--dot', dot);
    chip.style.setProperty('--bg', bg);
    chip.innerHTML = `<span class="dot"></span>${meta.key}<span class="count">${items.length}</span>`;
    chip.addEventListener('click', ()=> selectSubject(meta.key, meta.var));
    chip.dataset.key = meta.key;
    subjectsEl.appendChild(chip);
  });
}

function selectSubject(key, varName){
  active = key;
  [...subjectsEl.children].forEach(c=>{
    c.classList.toggle('active', c.dataset.key === key);
  });
  const dot = cssVar('--c-'+varName);
  panelDot.style.background = dot;
  panelTitle.textContent = key;
  const items = DATA[key] || [];
  panelCount.textContent = items.length + (items.length % 10 === 1 && items.length % 100 !== 11 ? ' запись' : (items.length % 10 >=2 && items.length % 10 <=4 && !(items.length % 100 >=12 && items.length % 100 <=14) ? ' записи' : ' записей'));

  listEl.innerHTML = '';
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">Записей нет</div>';
    return;
  }
  items.forEach((item, idx)=>{
    if(item.sectionHeader){
      const hdr = document.createElement('div');
      hdr.className = 'list-section-header';
      hdr.style.setProperty('--dot', dot);
      hdr.textContent = item.sectionHeader;
      listEl.appendChild(hdr);
    }
    const card = buildCard(item, idx, dot, key);
    listEl.appendChild(card);
  });
}

function buildCard(item, idx, dot, subjectKey){
  const card = document.createElement('div');
  card.className = 'report';
  card.style.setProperty('--dot', dot);
  card.innerHTML = `
    <div class="badge">${idx+1}</div>
    <div class="body">
      <div class="text"></div>
    </div>
    <div class="actions">
      <button class="copy-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>Копировать</span>
      </button>
    </div>
  `;
  card.querySelector('.text').textContent = item.text;

  const copyBtn = card.querySelector('.copy-btn');
  copyBtn.addEventListener('click', ()=> copyText(item.text, copyBtn));

  return card;
}

function copyText(text, btn){
  const done = ()=>{
    const span = btn.querySelector('span');
    const original = span.textContent;
    btn.classList.add('done');
    span.textContent = 'Скопировано';
    setTimeout(()=>{
      btn.classList.remove('done');
      span.textContent = original;
    }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

function init(){
  buildChips();
  const first = SUBJECT_META.find(m => (DATA[m.key]||[]).length > 0);
  if(first) selectSubject(first.key, first.var);
}
init();
</script>
</body>
